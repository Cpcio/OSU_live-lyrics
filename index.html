        // Some media implementations reject seeks while replacing a source.
      }
    }

    async function fetchMvForSong(songId, resolution) {
      try {
        return await fetchJson("/mv/for-song", {
          id: String(songId),
          r: String(resolution),
        });
      } catch {
        // api-enhanced exposes the same lookup as two public MV endpoints.
        const detail = await fetchJson("/song/detail", { ids: String(songId) });
        const song = detail?.songs?.[0];
        const mvId = Number(song?.mv || song?.mvid || 0);
        if (!mvId) return { hasMv: false, songId: Number(songId) };

        const urlData = await fetchJson("/mv/url", {
          id: String(mvId),
          r: String(resolution),
        });
        return {
          hasMv: Boolean(urlData?.data?.url),
          songId: Number(songId),
          mvId,
          url: urlData?.data?.url || "",
          r: Number(urlData?.data?.r || resolution),
        };
      }
    }

    async function fetchBilibiliMvBackground(songMeta, resolution, neteaseData = null) {
      if (!CONFIG.bilibiliBackgroundEnabled) return null;

      const durationMs = parseNumber(songMeta.durationMs, 0) || parseNumber(neteaseData?.durationMs, 0);
      const bilibili = await fetchJson("/bilibili/background", {
        title: String(songMeta.title || ""),
        artist: CONFIG.bilibiliSearchWithoutArtist ? "" : String(songMeta.artist || ""),
        durationMs: String(durationMs),
        r: String(resolution),
        maxDeviationPercent: String(clamp(Number(CONFIG.bilibiliMaxDurationDeviationPercent), 1, 30)),
      });
      if (!bilibili?.found || !bilibili?.mediaUrl) return null;

      return {
        url: bilibili.mediaUrl,
        source: `Bilibili ${bilibili.bvid || ""}`,
      };
    }

    async function updateMvBackground(songId, songMeta = {}, trackKey = currentTrackKey) {
      if (!CONFIG.mvBackgroundEnabled || !songId || !trackKey) {
        clearMvBackground();
        return;
      }

      const key = `${trackKey}:${songId}:${Math.round(clamp(Number(CONFIG.mvBackgroundResolution), 240, 1080))}:${CONFIG.mvBackgroundSourcePriority}:${CONFIG.bilibiliBackgroundEnabled}`;
      if (key === currentMvBackgroundKey) return;

      mvBackgroundAbortController?.abort();
      const controller = new AbortController();
      mvBackgroundAbortController = controller;
      currentMvBackgroundKey = key;

      try {
        const resolution = Math.round(clamp(Number(CONFIG.mvBackgroundResolution), 240, 1080));
        let neteaseData = null;
        let selected = null;
        const sources = CONFIG.mvBackgroundSourcePriority === "bilibili" && CONFIG.bilibiliBackgroundEnabled
          ? ["bilibili", "netease"]
          : ["netease", "bilibili"];

        for (const source of sources) {
          if (controller.signal.aborted || currentTrackKey !== trackKey || currentMvBackgroundKey !== key) return;
          if (source === "netease") {
            neteaseData ||= await fetchMvForSong(songId, resolution);
            if (neteaseData?.hasMv && neteaseData?.url) {
              selected = { url: neteaseData.url, source: `netease MV ${neteaseData.mvId || ""}` };
            }
          } else if (CONFIG.bilibiliBackgroundEnabled) {
            if (!parseNumber(songMeta.durationMs, 0) && !neteaseData) {
              neteaseData = await fetchMvForSong(songId, resolution);
            }
            selected = await fetchBilibiliMvBackground(songMeta, resolution, neteaseData);
          }
          if (selected) break;
        }

        if (controller.signal.aborted || currentTrackKey !== trackKey || currentMvBackgroundKey !== key) return;
        const videoUrl = selected?.url || "";
        const videoSource = selected?.source || "";

        if (!videoUrl) {
          clearMvBackground();
          return;
        }

        mvBackgroundEl.pause();
        mvBackgroundEl.onloadedmetadata = () => syncMvBackground(lastLiveTime, true);
        mvBackgroundEl.src = videoUrl;
        mvBackgroundEl.load();
        overlayEl?.classList.add("has-mv-background");
        syncMvBackground(lastLiveTime, true);
        try {
          await mvBackgroundEl.play();
        } catch {
          // The muted video can still be blocked by a damaged media response.
        }
        setStatus(`mv background: ${videoSource || "loaded"}`);
      } catch (error) {
        if (controller.signal.aborted) return;
        clearMvBackground();
        setStatus(`mv background unavailable: ${error.message}`);
      }
    }

    function refreshMvBackgroundForCurrentTrack() {
      if (!CONFIG.mvBackgroundEnabled) {
        clearMvBackground();
        return;
      }
      if (currentNeteaseSongId && currentTrackKey) {
        updateMvBackground(currentNeteaseSongId, currentNeteaseSongMeta, currentTrackKey);
      }
    }

    function parseLrc(lrc) {
      const lines = [];

      for (const rawLine of String(lrc || "").split(/\r?\n/)) {
        const tags = [...rawLine.matchAll(/\[(\d{1,2}):(\d{1,2})(?:[.:](\d{1,3}))?]/g)];
        if (!tags.length) continue;

        const text = rawLine.replace(/(?:\[\d{1,2}:\d{1,2}(?:[.:]\d{1,3})?])+/g, "").trim();
        if (!text) continue;

        for (const tag of tags) {
          const minutes = Number(tag[1]);
          const seconds = Number(tag[2]);
          const fraction = tag[3] || "0";
          const millis = Number(fraction.padEnd(3, "0").slice(0, 3));

          lines.push({
            time: minutes * 60000 + seconds * 1000 + millis,
            text,
          });
        }
      }

      return lines.sort((a, b) => a.time - b.time);
    }

    function parseYrc(yrc) {
      const lines = [];

      for (const rawLine of String(yrc || "").split(/\r?\n/)) {
        const lineTag = rawLine.match(/\[(\d+),(\d+)]/);
        if (!lineTag) continue;

        const text = rawLine
          .replace(/\[\d+,\d+]/g, "")
          .replace(/\(\d+,\d+(?:,\d+)?\)/g, "")
          .trim();
        if (!text) continue;

        const words = [];
        const wordMatcher = /\((\d+),(\d+)(?:,\d+)?\)([^()]*)/g;
        for (const match of rawLine.matchAll(wordMatcher)) {
          const wordText = match[3];
          if (!wordText) continue;
          words.push({
            time: Number(match[1]),
            duration: Number(match[2]),
            text: wordText,
          });
        }

        lines.push({
          time: Number(lineTag[1]),
          duration: Number(lineTag[2]),
          text,
          words,
        });
      }

      return lines.sort((a, b) => a.time - b.time);
    }

    function parseNeteaseLyricData(data) {
      const lrcLines = parseLrc(data.lrc?.lyric || "");
      const yrcLines = parseYrc(data.yrc?.lyric || "");
      const lines = yrcLines.length ? yrcLines : lrcLines;
      const translationLines = parseLrc(data.tlyric?.lyric || data.ytlrc?.lyric || "");

      return {
        lines,
        translations: translationLines,
        lyricFormat: yrcLines.length ? "yrc" : (lrcLines.length ? "lrc" : ""),
      };
    }

    function findLineIndex(lines, time) {
      if (!lines.length) return -1;

      let low = 0;
      let high = lines.length - 1;
      let answer = -1;

      while (low <= high) {
        const middle = Math.floor((low + high) / 2);

        if (lines[middle].time <= time) {
          answer = middle;
          low = middle + 1;
        } else {
          high = middle - 1;
        }
      }

      return answer;
    }

    function pickTranslation(time) {
      if (!CONFIG.showTranslation || !translatedLines.length) return "";

      const index = findLineIndex(translatedLines, time);
      if (index < 0) return "";
      return translatedLines[index].text;
    }

    function formatTime(ms) {
      const safe = Math.max(0, Number(ms) || 0);
      const minutes = Math.floor(safe / 60000);
      const seconds = Math.floor((safe % 60000) / 1000);
      const millis = Math.floor(safe % 1000);

      return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}.${String(millis).padStart(3, "0")}`;
    }

    function parseSpeedMultiplier(version) {
      const text = safeText(version);
      const matches = [
        ...text.matchAll(/(?:^|[^\d])(\d+(?:[\.,]\d+)?)\s*x(?:$|[^\d])/gi),
        ...text.matchAll(/(?:^|[^\d])x\s*(\d+(?:[\.,]\d+)?)(?:$|[^\d])/gi),
        ...text.matchAll(/(?:^|[^\d])((?:1|2)[\.,]\d+)(?:$|[^\d])/gi),
      ];

      for (const match of matches) {
        const value = Number(String(match[1]).replace(",", "."));
        if (value >= 0.5 && value <= 2.5) return value;
      }

      return 1;
    }

    function effectiveLyricTime(liveTime) {
      const manualSpeed = clamp(parseNumber(CONFIG.speedMultiplier, 1), 0.5, 2.5);
      const speed = CONFIG.autoSpeedFromDifficulty ? currentSpeedMultiplier * manualSpeed : manualSpeed;
      return Math.max(0, liveTime * speed + CONFIG.lyricOffsetMs + currentTrackOffsetMs);
    }

    function beatmapDuration(beatmap = {}, payload = {}) {
      const time = beatmap.time || payload.beatmap?.time || payload.menu?.bm?.time || {};
      const candidates = [
        time.full,
        time.mp3,
        time.lastObject,
        time.end,
        time.duration,
        beatmap.duration,
        beatmap.totalLength,
        beatmap.hitLength,
        beatmap.metadata?.duration,
      ];

      for (const value of candidates) {
        const duration = Number(value);
        if (Number.isFinite(duration) && duration > 0) return duration;
      }

      return 0;
    }

    function hasManualTrackOffset(result, cachedSong) {
      if (parseNumber(cachedSong?.lyricOffsetMs, 0) !== 0 && !isAutoOffsetEntry(cachedSong)) return true;
      if (cachedSong?.manual) return true;
      return parseNumber(result?.lyricOffsetMs, 0) !== 0;
    }

    async function applyAutoOffset(result, beatmap = {}, payload = {}, cachedSong = null) {
      if (!CONFIG.autoOffsetFromFirstObject || !result?.lines?.length) return result;
      if (hasManualTrackOffset(result, cachedSong)) return result;
      if (!window.LyricAlignment?.estimateOffset) return result;

      const firstObjectTime = await firstObjectTimeForAlignment(beatmap, payload);
      const speed = parseNumber(result.speedMultiplier, 1)
        * parseSpeedMultiplier(beatmap.version)
        * bpmDifficultyMultiplier(beatmap, result.neteaseBpm);
      const estimate = window.LyricAlignment.estimateOffset({
        lyricLines: result.lines,
        firstObjectTime,
        speed,
        maxOffsetMs: CONFIG.autoOffsetMaxMs,
        leadMs: CONFIG.autoOffsetLeadMs,
      });

      if (!estimate) return result;

      return {
        ...result,
        lyricOffsetMs: estimate.offset,
        autoOffsetMs: estimate.offset,
        autoOffsetSource: "first lyric to first object",
        firstLyricTimeMs: estimate.lyricTime,
        firstObjectTimeMs: estimate.firstObjectTime,
      };
    }

    function updateTimelineDuration(beatmap = {}, payload = {}, resetWhenMissing = false) {
      const duration = beatmapDuration(beatmap, payload);
      if (duration && duration !== currentDuration) {
        currentDuration = duration;
        lastTimelineBucket = -1;
      } else if (!duration && resetWhenMissing && currentDuration) {
        currentDuration = 0;
        lastTimelineBucket = -1;
      }
    }

    function renderTimeline(liveTime) {
      const duration = Number(currentDuration) || 0;
      if (!duration) {
        if (lastTimelineBucket !== 0) {
          lastTimelineBucket = 0;
          document.documentElement.style.setProperty("--progress", "0");
          timelineFillEl.style.height = "0%";
        }
        return;
      }

      const progress = clamp((Number(liveTime) || 0) / duration, 0, 1);
      const bucket = Math.round(progress * 1000);
      if (bucket === lastTimelineBucket) return;

      lastTimelineBucket = bucket;
      document.documentElement.style.setProperty("--progress", String(progress));
      timelineFillEl.style.height = `${progress * 100}%`;
    }

    function renderContext(container, lines) {
      container.textContent = "";

      for (const lineData of lines) {
        const line = document.createElement("div");
        line.className = "line context-line";
        line.dataset.lyricKey = lineData.key;
        line.textContent = lineData.text;
        container.appendChild(line);
      }
    }

    function setCurrentLine(lineData) {
      currentLineEl.dataset.lyricKey = lineData.key;
      currentLineEl.dataset.lyricText = lineData.text;
      currentLineEl.textContent = "";
      currentLyricProgressUnits = [];
      lastLyricProgressRenderAt = 0;

      if (!CONFIG.lyricProgressEnabled) {
        currentLineEl.textContent = lineData.text;
        return;
      }

      const timedWords = Array.isArray(lineData.words) ? lineData.words.filter((word) => word?.text) : [];
      const wordText = timedWords.map((word) => word.text).join("");
      const units = timedWords.length && wordText === lineData.text
        ? timedWords.map((word) => ({ text: word.text, time: word.time, duration: word.duration }))
        : Array.from(lineData.text || "").map((text) => ({ text }));

      for (const unit of units) {
        const element = document.createElement("span");
        element.className = "lyric-progress-unit";
        element.textContent = unit.text;
        currentLineEl.appendChild(element);
        currentLyricProgressUnits.push({ ...unit, element });
      }
    }

    function lyricProgressForLine(line, nextLine, time) {
      if (!line) return 0;

      if (Array.isArray(line.words) && line.words.length) {
        const totalUnits = line.words.reduce((sum, word) => sum + Math.max(1, Array.from(word.text || "").length), 0);
        let completedUnits = 0;
        for (const word of line.words) {
          const units = Math.max(1, Array.from(word.text || "").length);
          const start = Number(word.time) || line.time;
          const duration = Math.max(1, Number(word.duration) || 1);
          if (time >= start + duration) {
            completedUnits += units;
          } else if (time > start) {
            completedUnits += units * clamp((time - start) / duration, 0, 1);
            break;
          } else {
            break;
          }
        }
        return clamp(completedUnits / Math.max(1, totalUnits), 0, 1);
      }

      const start = Number(line.time) || 0;
      const end = Number(nextLine?.time) || (start + Math.max(750, Number(line.duration) || 3500));
      return clamp((time - start) / Math.max(1, end - start), 0, 1);
    }

    function updateCurrentLineProgress(line, nextLine, time) {
      if (!CONFIG.lyricProgressEnabled || !line || currentLineEl.dataset.lyricKey === undefined) return;
      const units = currentLyricProgressUnits;
      if (!units.length) return;

      const now = performance.now();
      if (now - lastLyricProgressRenderAt < 33) return;
      lastLyricProgressRenderAt = now;

      const dimOpacity = clamp(Number(CONFIG.lyricProgressUnplayedOpacity), 0.12, 0.9);
      const applyUnitProgress = (unit, progress) => {
        const stepped = Math.round(clamp(progress, 0, 1) * 24) / 24;
        if (unit.progressStep === stepped) return;
        unit.progressStep = stepped;
        const opacity = dimOpacity + (1 - dimOpacity) * stepped;
        unit.element.style.color = `rgba(255, 255, 255, ${opacity.toFixed(3)})`;
      };

      const hasWordTiming = units.every((unit) => Number.isFinite(Number(unit.time)) && Number(unit.duration) >= 0);
      if (hasWordTiming) {
        for (const unit of units) {
          const start = Number(unit.time);
          const duration = Math.max(1, Number(unit.duration));
          applyUnitProgress(unit, (time - start) / duration);
        }
        return;
      }

      const lineProgress = lyricProgressForLine(line, nextLine, time);
      const completedUnits = lineProgress * units.length;
      for (let index = 0; index < units.length; index += 1) {
        applyUnitProgress(units[index], completedUnits - index);
      }
    }

    function applyLyricDom({ before, current, timeText, translation, after }) {
      renderContext(beforeLinesEl, before);
      setCurrentLine(current);
      currentTimeEl.textContent = timeText;
      translationEl.textContent = translation;
      renderContext(afterLinesEl, after);
    }

    function captureLyricRects() {
      const rects = new Map();
      if (!lyricsEl) return rects;

      for (const element of lyricsEl.querySelectorAll(".line[data-lyric-key]")) {
        const style = getComputedStyle(element);
        rects.set(element.dataset.lyricKey, {
          rect: element.getBoundingClientRect(),
          className: element.className,
          text: element.dataset.lyricText || element.textContent || "",
          style: {
            color: style.color,
            opacity: style.opacity,
          },
        });
      }

      return rects;
    }

    function animateLyricRoll(previousRects) {
      if (!lyricsEl || typeof Element === "undefined") return;

      const duration = 280;
      const easing = "cubic-bezier(.2,.75,.18,1)";
      const nextKeys = new Set();

      for (const element of lyricsEl.querySelectorAll(".line[data-lyric-key]")) {
        const key = element.dataset.lyricKey;
        nextKeys.add(key);
        const previous = previousRects.get(key);
        const next = element.getBoundingClientRect();
        const nextStyle = getComputedStyle(element);

        if (previous && typeof element.animate === "function") {
          const dx = previous.rect.left - next.left;
          const dy = previous.rect.top - next.top;
          element.animate([
            {
              transform: `translate(${dx}px, ${dy}px)`,
              opacity: previous.style.opacity || 0.78,
              color: previous.style.color,
            },
            {
              transform: "translate(0, 0)",
              opacity: nextStyle.opacity || 1,
              color: nextStyle.color,
            },
          ], { duration, easing });
        } else if (typeof element.animate === "function") {
          element.animate([
            { transform: "translateY(18px)", opacity: 0 },
            { transform: "translateY(0)", opacity: nextStyle.opacity || 1 },
          ], { duration, easing });
        }
      }

      const lyricsRect = lyricsEl.getBoundingClientRect();
      for (const [key, previous] of previousRects.entries()) {
        if (nextKeys.has(key)) continue;

        const ghost = document.createElement("div");
        ghost.className = `${previous.className} line-ghost`;
        ghost.textContent = previous.text;
        ghost.style.left = `${previous.rect.left - lyricsRect.left}px`;
        ghost.style.top = `${previous.rect.top - lyricsRect.top}px`;
        ghost.style.width = `${previous.rect.width}px`;
        lyricsEl.appendChild(ghost);

        if (typeof ghost.animate === "function") {
          const animation = ghost.animate([
            { transform: "translateY(0)", opacity: getComputedStyle(ghost).opacity || 0.78 },
            { transform: "translateY(-18px)", opacity: 0 },
          ], { duration, easing });
          animation.onfinish = () => ghost.remove();
        } else {
          ghost.remove();
        }
      }
    }

    function updateLyricDom(view) {
      clearTimeout(lyricTransitionTimer);
      const mode = String(CONFIG.lyricTransitionMode || "roll").toLowerCase();

      if (mode === "off" || mode === "none" || !lyricsEl) {
        lyricsEl?.classList.remove("is-transitioning");
        applyLyricDom(view);
        return;
      }

      if (mode === "roll" || mode === "slide") {
        lyricsEl.classList.remove("is-transitioning");
        const previousRects = captureLyricRects();
        applyLyricDom(view);
        requestAnimationFrame(() => animateLyricRoll(previousRects));
        return;
      }

      lyricsEl.classList.add("is-transitioning");

      lyricTransitionTimer = setTimeout(() => {
        applyLyricDom(view);
        requestAnimationFrame(() => lyricsEl.classList.remove("is-transitioning"));
      }, 90);
    }

    function renderLyrics(time) {
      if (loadedLyricsTrackKey !== currentTrackKey) return;
      if (!lyricLines.length) return;

      const adjustedTime = effectiveLyricTime(time);
      const index = findLineIndex(lyricLines, adjustedTime);
      const currentIndex = Math.max(0, index);
      const currentLine = lyricLines[currentIndex];
      const nextLine = lyricLines[currentIndex + 1];
      if (currentIndex === lastRenderedLyricIndex) {
        currentTimeEl.textContent = formatTime(lyricLines[currentIndex]?.time || adjustedTime);
        updateCurrentLineProgress(currentLine, nextLine, adjustedTime);
        return;
      }

      lastRenderedLyricIndex = currentIndex;
      const beforeCount = clamp(Number(CONFIG.contextBefore), 0, 8);
      const afterCount = clamp(Number(CONFIG.contextAfter), 0, 8);
      const beforeStart = Math.max(0, currentIndex - beforeCount);
      const toViewLine = (line, lineIndex) => ({
        key: `${line.time}|${lineIndex}|${line.text}`,
        text: line.text,
        words: line.words || [],
      });
      const before = lyricLines
        .slice(beforeStart, currentIndex)
        .map((line, index) => toViewLine(line, beforeStart + index));
      const after = lyricLines
        .slice(currentIndex + 1, currentIndex + 1 + afterCount)
        .map((line, index) => toViewLine(line, currentIndex + 1 + index));

      updateLyricDom({
        before,
        current: toViewLine(currentLine || { time: adjustedTime, text: "" }, currentIndex),
        timeText: formatTime(lyricLines[currentIndex]?.time || adjustedTime),
        translation: pickTranslation(adjustedTime),
        after,
      });
      updateCurrentLineProgress(currentLine, nextLine, adjustedTime);
    }

    function scoreSong(song, title, artist) {
      const targetTitle = normalizeForCompare(title);
      const targetArtist = normalizeForCompare(artist);
      const targetVariants = titleVariants(title).map(normalizeForCompare).filter(Boolean);
      const songTitle = normalizeForCompare(song.name);
      const songAlbum = normalizeForCompare(song.album?.name || song.al?.name || "");
      const songArtists = normalizeForCompare((song.artists || song.ar || []).map((item) => item.name).join(" "));

      let score = 0;

      if (songTitle === targetTitle) score += 80;
      else if (songTitle.includes(targetTitle) || targetTitle.includes(songTitle)) score += 45;

      for (const variant of targetVariants) {
        if (songTitle === variant) score += 72;
        else if (songTitle.includes(variant)) score += 52;
        else if (variant.includes(songTitle)) score += 32;
        if (songAlbum.includes(variant)) score += 14;
      }

      if (songArtists === targetArtist) score += 50;
      else if (songArtists.includes(targetArtist) || targetArtist.includes(songArtists)) score += 28;
      else if (!targetArtist) score += 8;

      return score;
    }

    function timeoutSignal(timeoutMs) {
      if (!window.AbortController) return {};

      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);

      return {
        signal: controller.signal,
        abort: () => controller.abort(),
        done: () => clearTimeout(timer),
      };
    }

    async function fetchJson(path, params) {
      const queryUrl = new URL(path, CONFIG.neteaseApiBase);

      for (const [key, value] of Object.entries(params || {})) {
        queryUrl.searchParams.set(key, value);
      }

      queryUrl.searchParams.set("timestamp", Date.now());

      try {
        return await requestJson(queryUrl.toString(), { method: "GET" });
      } catch (error) {
        const message = String(error.message || "");
        if (!CONFIG.allowPostFallback || !/(404|405)/.test(message)) {
          throw error;
        }

        const postUrl = new URL(path, CONFIG.neteaseApiBase);
        const body = new URLSearchParams();

        for (const [key, value] of Object.entries(params || {})) {
          body.set(key, value);
        }

        body.set("timestamp", Date.now());

        return requestJson(postUrl.toString(), {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
          body,
        });
      }
    }

    async function requestJson(url, options) {
      const timeout = timeoutSignal(CONFIG.fetchTimeoutMs);

      try {
        const response = await fetch(url, {
          cache: "no-store",
          mode: "cors",
          ...options,
          signal: timeout.signal,
        });

        if (!response.ok) {
          throw new Error(`${new URL(url).pathname} returned ${response.status}`);
        }

        return response.json();
      } finally {
        timeout.done?.();
      }
    }

    async function searchNeteaseSongs(title, artist) {
      const queries = searchQueries(title, artist);
      const byId = new Map();

      for (const keywords of queries) {
        for (const endpoint of CONFIG.searchEndpoints) {
          try {
            const data = await fetchJson(endpoint, {
              keywords,
              limit: String(CONFIG.searchLimit),
              type: "1",
            });

            const songs = data.result?.songs || [];
            for (const song of songs) {
              if (!song?.id || byId.has(song.id)) continue;
              byId.set(song.id, song);
            }
          } catch {
            // Continue with the next query or endpoint.
          }
        }
      }

      const scored = [...byId.values()]
        .map((song) => ({ song, score: scoreSong(song, title, artist) }))
        .sort((a, b) => b.score - a.score);

      return scored.map((item) => item.song);
    }

    async function loadLyricsBySongId(songId, source, offset = 0, speed = 1) {
      let parsed = { lines: [], translations: [], lyricFormat: "" };

      try {
        const data = await fetchJson("/lyric/new", { id: String(songId) });
        parsed = parseNeteaseLyricData(data);
      } catch {
        // Older API deployments may not expose the enhanced lyric endpoint.
      }

      if (!parsed.lines.length) {
        const data = await fetchJson("/lyric", { id: String(songId) });
        parsed = parseNeteaseLyricData(data);
      }

      return {
        neteaseSongId: songId,
        lines: parsed.lines,
        translations: parsed.translations,
        source,
        lyricFormat: parsed.lyricFormat,
        lyricOffsetMs: offset,
        speedMultiplier: speed,
      };
    }

    async function loadLyricsByAudioMatch(title, artist, beatmap, options = {}) {
      const match = await audioMatchCurrentBeatmap(beatmap, { title, artist }, options);
      const song = match.song;
      const result = await loadLyricsBySongId(
        song.id,
        `audio match ${song.id}: ${song.name || title}`,
        match.offsetMs,
        1
      );

      result.neteaseSongTitle = song.name || title;
      result.neteaseSongArtist = (song.artists || song.ar || []).map((item) => item?.name).filter(Boolean).join("/") || artist;
      result.neteaseDurationMs = parseNumber(song.dt || song.duration || song.durationMs, 0);
      result.neteaseBpm = neteaseSongBpm(song);
      result.audioMatchSource = "netease audio match";
      result.audioMatchStartTimeMs = match.startTimeMs;
      result.audioMatchSampleStartMs = match.sampleStartMs;
      result.audioMatchEffectiveSampleStartMs = match.effectiveSampleStartMs;
      result.audioMatchSpeed = match.speed;
      result.audioMatchDebug = formatAudioMatchDebug(match.debugWindows || [match], match.decision || "selected");
      result.audioMatchConfidence = match.confidence || "";
      result.autoOffsetMs = match.offsetMs;
      result.autoOffsetSource = "netease audio match";
      return result;
    }

    async function bpmAudioMatchContext(title, artist, beatmap) {
      const taggedBpm = difficultyBpmTag(beatmap.version);
      if (!CONFIG.bpmTagAudioMatchEnabled || isPackBeatmap(beatmap) || !taggedBpm) return null;

      try {
        const candidates = await searchNeteaseSongs(title, artist);
        for (const song of candidates) {
          const sourceBpm = neteaseSongBpm(song);
          const rawMultiplier = sourceBpm ? taggedBpm / sourceBpm : 0;
          const multiplier = bpmDifficultyMultiplier(beatmap, sourceBpm);
          if (rawMultiplier >= 0.5 && rawMultiplier <= 2.5 && Math.abs(multiplier - 1) >= 0.01) {
            return { titleCandidates: candidates, difficultySpeedMultiplier: multiplier, taggedBpm, sourceBpm };
          }
        }
      } catch {
        // BPM tags are optional acceleration hints; keep the normal path intact.
      }
      return null;
    }

    async function loadLyricsByMetadata(title, artist, beatmap, payload = {}) {
      const cachedSong = getSongCacheEntry(title, artist, beatmap);
      const cachedSongId = cachedSong?.neteaseSongId || cachedSong?.songId;
      const offset = parseNumber(cachedSong?.lyricOffsetMs, 0);
      const speed = parseNumber(cachedSong?.speedMultiplier, 1);
      const cachedAudioMatchOffsetOk = !cachedSong?.audioMatchSource || audioMatchOffsetInRange(cachedSong.lyricOffsetMs);
      if (cachedSongId && cachedAudioMatchOffsetOk) {
        const cacheOffset = cacheLyricOffset(cachedSong);
        const cacheSpeed = speed;
        let result = await loadLyricsBySongId(cachedSongId, `song cache ${cachedSongId}`, cacheOffset, cacheSpeed);
        result.neteaseSongTitle = cachedSong?.title || title;
        result.neteaseSongArtist = cachedSong?.artist || artist;
        result.neteaseDurationMs = parseNumber(cachedSong?.neteaseDurationMs, 0);
        result.neteaseBpm = parseNumber(cachedSong?.neteaseBpm, 0);
        result.audioMatchSource = cachedSong?.audioMatchSource || "";
        result.audioMatchConfidence = cachedSong?.audioMatchConfidence || "";
        result = await applyAutoOffset(result, beatmap, payload, cachedSong);

        return result;
      }

      let result = await loadNeteaseLyrics(title, artist);
      result = await applyAutoOffset(result, beatmap, payload, cachedSong);
      return result;
    }

    async function loadLyricsForTrack(title, artist, beatmap, payload = {}) {
      const bpmContext = CONFIG.audioMatchEnabled ? await bpmAudioMatchContext(title, artist, beatmap) : null;
      if (CONFIG.audioMatchEnabled) {
        try {
          const result = await loadLyricsByAudioMatch(title, artist, beatmap, bpmContext || {});
          if (result.lines.length) return result;

          return {
            ...result,
            instrumental: true,
            reason: `${result.source || `audio match ${result.neteaseSongId || ""}`} has no synced LRC/YRC`,
          };
        } catch (error) {
          if (String(error.message || "").includes("audio match aborted")) throw error;
          setStatus(`audio match failed, fallback to title search: ${error.message}`);
        }
      }

      const metadataResult = await loadLyricsByMetadata(title, artist, beatmap, payload);
      if (!metadataResult.neteaseSongId && !metadataResult.lines.length) {
        metadataResult.audioMatchConfidence = "0/4";
      }
      return metadataResult;
    }

    async function loadNeteaseLyrics(title, artist) {
      const songs = await searchNeteaseSongs(title, artist);
      if (!songs.length) {
        return { lines: [], translations: [], source: "", reason: "no NetEase candidates found" };
      }

      let bestEmpty = null;

      for (const song of songs.slice(0, Math.max(1, CONFIG.searchLimit))) {
        try {
          const loaded = await loadLyricsBySongId(song.id, `${song.name} - ${(song.artists || song.ar || []).map((item) => item.name).join("/")}`);
          const result = {
            neteaseSongId: song.id,
            neteaseSongTitle: song.name || title,
            neteaseSongArtist: (song.artists || song.ar || []).map((item) => item?.name).filter(Boolean).join("/") || artist,
            neteaseDurationMs: parseNumber(song.dt || song.duration || song.durationMs, 0),
            neteaseBpm: neteaseSongBpm(song),
            lines: loaded.lines,
            translations: loaded.translations,
            source: loaded.source,
            lyricFormat: loaded.lyricFormat,
          };

          if (result.lines.length) {
            return result;
          }

          bestEmpty ||= result;
        } catch {
          // Try another candidate. Some songs have no lyric endpoint result.
        }
      }

      if (bestEmpty) {
        bestEmpty.reason = `candidate has no synced LRC: ${bestEmpty.source || bestEmpty.neteaseSongId || "unknown"}`;
        return bestEmpty;
      }

      return { lines: [], translations: [], source: "", reason: "no synced LRC returned by candidates" };
    }

    async function refreshTrack(payload) {
      const {
        beatmap,
        rawTitle,
        rawArtist,
        searchTitle,
        searchArtist,
        key,
      } = trackInfoFromPayload(payload);

      updateTimelineDuration(beatmap, payload);
      updateSongHeader(rawTitle, rawArtist);

      updateBeatmapColor(beatmap, payload).catch(() => {
        const fallback = hexToRgb(CONFIG.panelColor);
        applyPanelColor(fallback);
        applyAccentColor(fallback);
      });

      if (!rawTitle) {
        currentAudioMatchConfidence = null;
        setAudioMatchState("idle");
        if (currentTrackKey || pendingTrackKey || lyricLines.length) {
          currentTrackKey = "";
          lastSeenTrackKey = "";
          pendingTrackKey = "";
          pendingTrackPayload = null;
          pendingTrackSince = 0;
          currentDuration = 0;
          audioMatchAbortController?.abort();
          currentNeteaseSongId = "";
          currentNeteaseSongMeta = { title: "", artist: "", durationMs: 0 };
          clearMvBackground();
          clearTimeout(pendingTrackTimer);
          lyricLoadToken += 1;
          clearDisplayedLyrics("Waiting for beatmap data");
          setStatus("waiting for beatmap data from tosu");
        }
        return;
      }

      if (key === currentTrackKey && (loadedLyricsTrackKey === key || loadingLyricsTrackKey === key)) return;
      if (key === pendingTrackKey && loadingLyricsTrackKey === key) {
        pendingTrackPayload = payload;
        return;
      }

      if (key !== pendingTrackKey) {
        pendingTrackKey = key;
        pendingTrackPayload = payload;
        pendingTrackSince = Date.now();
        currentAudioMatchConfidence = null;
        setAudioMatchState(CONFIG.audioMatchEnabled ? "matching" : "disabled");
        updateTimelineDuration(beatmap, payload, true);
        clearTimeout(pendingTrackTimer);
        lyricLoadToken += 1;
        currentNeteaseSongId = "";
        currentNeteaseSongMeta = { title: "", artist: "", durationMs: 0 };
        clearMvBackground();
        clearDisplayedLyrics("Preparing lyrics search");
        setStatus(`beatmap changed, waiting for stable data: ${searchArtist ? `${searchArtist} - ` : ""}${searchTitle}`);
        pendingTrackTimer = setTimeout(() => {
          if (pendingTrackKey === key) {
            refreshTrack(pendingTrackPayload || payload).catch((error) => {
              setStatus(`track refresh error: ${error.message}`);
            });
          }
        }, 320);
        return;
      }

      pendingTrackPayload = payload;

      if (Date.now() - pendingTrackSince < 300) return;

      pendingTrackKey = "";
      pendingTrackPayload = null;
      pendingTrackSince = 0;
      clearTimeout(pendingTrackTimer);
      currentTrackKey = key;

      const token = ++lyricLoadToken;
        currentSpeedMultiplier = parseSpeedMultiplier(beatmap.version);
      loadingLyricsTrackKey = key;
      clearDisplayedLyrics("Searching lyrics");
      loadingLyricsTrackKey = key;
      updateTimelineDuration(beatmap, payload);
      setStatus(`searching lyrics: ${searchArtist ? `${searchArtist} - ` : ""}${searchTitle}`);

      try {
        const reusedResult = sameSongSetResult(beatmap);
        const result = reusedResult || await loadLyricsForTrack(searchTitle, searchArtist, beatmap, payload);
        if (token !== lyricLoadToken) return;
        if (currentTrackKey !== key || trackInfoFromPayload(latestTrackPayload || {}).key !== key) return;
        if (result.neteaseSongId && result.lines?.length) {
          writeSongCacheIndex(searchTitle, searchArtist, beatmap, result);
        }
        if (!reusedResult) rememberSameSongSetResult(beatmap, result);

        loadingLyricsTrackKey = "";
        currentNeteaseSongId = String(result.neteaseSongId || "");
        currentNeteaseSongMeta = {
          title: result.neteaseSongTitle || searchTitle,
          artist: result.neteaseSongArtist || searchArtist,
          durationMs: parseNumber(result.neteaseDurationMs, 0),
        };
        lyricLines = result.lines;
        translatedLines = result.translations;
        loadedLyricsTrackKey = key;
        currentSpeedMultiplier *= bpmDifficultyMultiplier(beatmap, result.neteaseBpm);
        currentSpeedMultiplier *= parseNumber(result.speedMultiplier, 1);
        currentTrackOffsetMs = parseNumber(result.lyricOffsetMs, 0);
        currentAutoOffsetSource = result.autoOffsetSource || "";
        updateOffsetBadge();
        currentAudioMatchConfidence = result.audioMatchConfidence || null;
        setAudioMatchState(result.audioMatchSource || result.audioMatchSucceeded
          ? "success"
          : (CONFIG.audioMatchEnabled ? "fallback" : "disabled"));

        if (lyricLines.length) {
          currentLineEl.textContent = "Lyrics ready";
          setStatus([
            `lyrics: ${result.source || "loaded"}`,
            result.audioMatchDebug || "",
          ].filter(Boolean).join("; "));
          lastRenderedLyricIndex = -2;
          renderLyrics(lastLiveTime);
        } else {
          currentLineEl.textContent = result.instrumental ? "纯音乐，请欣赏" : "No synced lyrics found";
          setStatus(result.instrumental
            ? [
              `instrumental: ${result.source || "audio match found no timed lyrics"}`,
              result.audioMatchDebug || "",
            ].filter(Boolean).join("; ")
            : [
              `no synced lyrics: ${result.reason || result.source || "song found, but no timed LRC was returned"}`,
              result.audioMatchDebug || "",
            ].filter(Boolean).join("; "));
          lastRenderedLyricIndex = -2;
        }

        // Background lookup is deliberately outside the lyric transaction.
        // A third-party video failure must never delay or replace lyrics.
        void updateMvBackground(currentNeteaseSongId, currentNeteaseSongMeta, key);
      } catch (error) {
        if (token !== lyricLoadToken) return;

        loadingLyricsTrackKey = "";
        clearDisplayedLyrics("Lyrics service unavailable");
        currentLineEl.textContent = "Lyrics service unavailable";
        setStatus(`lyrics API unavailable: ${error.message}`);
      }
    }

    function connectTosu() {
      clearTimeout(tosuReconnectTimer);
      const connectionId = ++tosuConnectionId;

      try {
        tosuSocket?.close();
      } catch {
        // The old socket may already be closed.
      }

      const socket = new WebSocket(`${CONFIG.tosuWebSocket}?l=${getCounterPathForQuery()}`);
      tosuSocket = socket;

      socket.addEventListener("open", () => {
        if (connectionId !== tosuConnectionId) return;
        setStatus("tosu websocket: connected");
      });

      socket.addEventListener("message", (event) => {
        if (connectionId !== tosuConnectionId) return;

        try {
          const data = JSON.parse(event.data);
          latestTrackPayload = data;
          const info = trackInfoFromPayload(data);
          const beatmap = info.beatmap;
          const incomingKey = info.key;
          const incomingLiveTime = Number(beatmap.time?.live || 0);
          const liveTimeReset = lastSeenLiveTime > 5000 && incomingLiveTime < Math.max(1200, lastSeenLiveTime - 3000);
          const trackChanged = Boolean(incomingKey && incomingKey !== lastSeenTrackKey);

          if (info.rawTitle && incomingKey && trackChanged) {
            lastSeenTrackKey = incomingKey;
            if ((loadedLyricsTrackKey && loadedLyricsTrackKey !== incomingKey) || (loadingLyricsTrackKey && loadingLyricsTrackKey !== incomingKey)) {
              lyricLoadToken += 1;
              clearDisplayedLyrics("Searching lyrics");
            }
          } else if (liveTimeReset && !incomingKey) {
            currentTrackKey = "";
            pendingTrackKey = "";
            pendingTrackPayload = null;
            pendingTrackSince = 0;
            clearTimeout(pendingTrackTimer);
            lyricLoadToken += 1;
            clearDisplayedLyrics("Searching lyrics");
          }

          lastSeenLiveTime = incomingLiveTime;
          lastLiveTime = Number(beatmap.time?.live || 0);
          updateMvPlaybackState(lastLiveTime);
          updateTimelineDuration(beatmap, data);

          refreshTrack(data).catch((error) => {
            setStatus(`track refresh error: ${error.message}`);
          });
          renderTimeline(lastLiveTime);
          syncMvBackground(lastLiveTime);
          renderLyrics(lastLiveTime);
        } catch (error) {
          setStatus(`tosu data error: ${error.message}`);
        }
      });

      socket.addEventListener("close", () => {
        if (connectionId !== tosuConnectionId) return;
        setStatus("tosu websocket: reconnecting (cannot receive beatmap/time data)");
        clearTimeout(tosuReconnectTimer);
        tosuReconnectTimer = setTimeout(connectTosu, CONFIG.retryDelayMs);
      });

      socket.addEventListener("error", () => {
        if (connectionId !== tosuConnectionId) return;
        socket.close();
      });
    }

    function sendSettingsCommand(name = "getSettings", command = getCounterPathForCommand(), retries = 1) {
      if (!settingsSocket || settingsSocket.readyState !== WebSocket.OPEN) {
        if (retries <= 6) {
          setTimeout(() => sendSettingsCommand(name, command, retries + 1), 120);
        }
        return;
      }

      try {
        const payload = typeof command === "object" ? JSON.stringify(command) : command;
        settingsSocket.send(`${name}:${payload}`);
      } catch (error) {
        if (retries <= 6) {
          setTimeout(() => sendSettingsCommand(name, command, retries + 1), 300);
          return;
        }

        console.info("settings command failed", error);
      }
    }

    function connectSettings() {
      clearTimeout(settingsReconnectTimer);
      clearInterval(settingsLiveSyncTimer);
      const connectionId = ++settingsConnectionId;

      try {
        settingsSocket?.close();
      } catch {
        // The old socket may already be closed.
      }

      try {
        settingsSocket = new WebSocket(`ws://127.0.0.1:24050/websocket/commands?l=${getCounterPathForQuery()}`);
      } catch {
        return;
      }

      settingsSocket.addEventListener("open", () => {
        if (connectionId !== settingsConnectionId) return;

        sendSettingsCommand("getSettings", getCounterPathForCommand());
        settingsLiveSyncTimer = setInterval(() => {
          if (connectionId !== settingsConnectionId) return;
          sendSettingsCommand("getSettings", getCounterPathForCommand());
        }, 1000);
      });

      settingsSocket.addEventListener("message", (event) => {
        if (connectionId !== settingsConnectionId) return;

        try {
          const payload = JSON.parse(event.data);
          if (payload?.error || payload?.message?.error) return;

          const command = payload.command || payload.event || payload.type;
          const commandName = String(command || "").toLowerCase();
          let source = null;

          if (Array.isArray(payload)) {
            source = payload;
          } else if (command === "getSettings") {
            source = payload.message || payload.settings || payload.data || payload;
          } else if (!command || commandName.includes("setting")) {
            source = payload.settings || payload.data || payload.message || payload;
          }

          if (source) {
            applySettings(source, { silent: true });
          }
        } catch (error) {
          console.info("settings hot reload message ignored", error);
        }
      });

      settingsSocket.addEventListener("close", () => {
        if (connectionId !== settingsConnectionId) return;
        clearInterval(settingsLiveSyncTimer);
        settingsReconnectTimer = setTimeout(connectSettings, CONFIG.retryDelayMs);
      });

      settingsSocket.addEventListener("error", (error) => {
        if (connectionId !== settingsConnectionId) return;
        console.info("settings hot reload unavailable", error);
        try {
          settingsSocket?.close();
        } catch {
          // The close handler owns reconnecting this optional channel.
        }
      });
    }

    applyVisualConfig();
    applyDebugStatusVisibility();
    updateAudioMatchBadge();
    loadSettingsFile().finally(() => Promise.allSettled([
      loadSongCacheIndex(),
      loadSongAliases(),
    ])).finally(() => {
      connectSettings();
      connectTosu();
    });
  </script>
</body>
</html>
