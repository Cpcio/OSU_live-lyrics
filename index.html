<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tosu Live Lyrics</title>
  <link rel="stylesheet" href="css/overlay-base.css?v=20261004-runtime-mv-2" />
  <link rel="stylesheet" href="css/overlay-layouts.css?v=20261004-runtime-mv-2" />
</head>
<body>
  <main class="overlay" aria-live="polite">
    <video id="mvBackground" class="mv-background" muted loop playsinline preload="metadata"></video>
    <section class="song">
      <div id="songIcon" class="song-icon" aria-hidden="true"><img id="songIconImage" alt="" /></div>
      <div id="songCopy" class="song-copy">
        <span id="title" class="title">Waiting for beatmap data...</span>
        <span class="dashboard-header-final">
          <span id="titleTail" class="title-tail"></span>
          <span id="artist" class="artist"></span>
        </span>
      </div>
      <div class="song-badges">
        <div id="audioMatchBadge" class="audio-match-badge">IDLE</div>
        <div id="offsetBadge" class="offset-badge">+0ms</div>
      </div>
    </section>

    <section class="lyrics-shell">
      <div class="lyrics">
        <div id="beforeLines" class="context"></div>
        <div class="current-block">
          <div id="currentLine" class="line current">Waiting for tosu WebSocket data</div>
          <div class="meta-row">
            <div id="translation" class="translation"></div>
          </div>
        </div>
        <div id="afterLines" class="context"></div>
      </div>
      <div id="currentTime" class="current-time">00:00.000</div>
      <div class="timeline" aria-hidden="true">
        <div id="timelineFill" class="timeline-fill"></div>
        <canvas id="timelineVisualizer" class="timeline-visualizer"></canvas>
      </div>
    </section>

    <div id="status" class="status">tosu websocket: connecting to 127.0.0.1:24050</div>
  </main>

  <script src="js/lyric-alignment.js?v=20260702-2"></script>
  <script src="js/afp.wasm.js?v=20260702-2"></script>
  <script src="js/afp.js?v=20261004-runtime-mv-2"></script>
  <script src="js/audio-reference-align.js?v=20260917-1"></script>
  <!-- Ordered classic scripts: shared state first, side effects in boot last. -->
  <script defer src="js/overlay/state.js?v=20261004-runtime-mv-2"></script>
  <script defer src="js/overlay/utils.js?v=20261004-runtime-mv-2"></script>
  <script defer src="js/overlay/settings.js?v=20261004-runtime-mv-2"></script>
  <script defer src="js/overlay/metadata.js?v=20261004-runtime-mv-2"></script>
  <script defer src="js/overlay/catalog.js?v=20261004-runtime-mv-2"></script>
  <script defer src="js/overlay/quality.js?v=20261004-runtime-mv-2"></script>
  <script defer src="js/overlay/network.js?v=20261004-runtime-mv-2"></script>
  <script defer src="js/overlay/audio.js?v=20261004-runtime-mv-2"></script>
  <script defer src="js/overlay/match-a.js?v=20261004-sample-rate-44100"></script>
  <script defer src="js/overlay/match-b.js?v=20261004-runtime-mv-2"></script>
  <script defer src="js/overlay/background.js?v=20261004-runtime-mv-2"></script>
  <script defer src="js/overlay/layout.js?v=20261004-runtime-mv-2"></script>
  <script defer src="js/overlay/lyrics.js?v=20261004-runtime-mv-2"></script>
  <script defer src="js/overlay/renderer.js?v=20261004-runtime-mv-2"></script>
  <script defer src="js/overlay/tracks.js?v=20261004-runtime-mv-2"></script>
  <script defer src="js/overlay/connections.js?v=20261004-runtime-mv-2"></script>
  <script defer src="js/overlay/boot.js?v=20261004-runtime-mv-2"></script>
</body>
</html>
