<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tosu Live Lyrics</title>
  <style>
    :root {
      --scale: 1;
      --panel-r: 9;
      --panel-g: 12;
      --panel-b: 18;
      --panel-alpha: 0.5;
      --panel-border: rgba(255, 255, 255, 0.12);
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.68);
      --accent: #84f4d0;
      --overlay-width: 960px;
      --lyrics-height: 190px;
      --progress-color: #84f4d0;
      --timeline-top: #84f4d0;
      --timeline-bottom: #7ca8ff;
      --lyric-shift: 0px;
      --overlay-font: "Segoe UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      --lyric-unplayed-opacity: 0.46;
      --title-font-scale: 1;
      --artist-font-scale: 1;
      --lyric-font-scale: 1;
      --context-font-scale: 1;
      --translation-font-scale: 1;
      --offset-font-scale: 1;
      --time-font-scale: 1;
      --status-font-scale: 1;
      --mv-overlay-opacity: 0.58;
      --mv-brightness: 0.8;
      --mv-opacity: 1;
      --mv-crop-width: 0.9;
      --mv-crop-height: 0.9;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      color: var(--text-main);
      font-family: var(--overlay-font);
      letter-spacing: 0;
    }

    .overlay {
      position: absolute;
      left: 48px;
      bottom: 52px;
      width: min(var(--overlay-width), calc(100vw - 96px));
      max-height: calc(100vh - 104px);
      padding: 20px 24px 22px;
      overflow: hidden;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      background: rgba(var(--panel-r), var(--panel-g), var(--panel-b), var(--panel-alpha));
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.28);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.78);
      contain: layout paint style;
    }

    .mv-background {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 0;
      display: none;
      width: calc(100% / var(--mv-crop-width));
      height: calc(100% / var(--mv-crop-height));
      object-fit: cover;
      background: #000;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transform-origin: center;
      filter: brightness(var(--mv-brightness));
      opacity: var(--mv-opacity);
    }

    .overlay.has-mv-background {
      background: transparent;
    }

    .overlay.has-mv-background .mv-background {
      display: block;
    }

    .overlay.has-mv-background::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background: rgba(var(--panel-r), var(--panel-g), var(--panel-b), var(--mv-overlay-opacity));
      pointer-events: none;
    }

    .overlay > section,
    .overlay > .status {
      position: relative;
      z-index: 2;
    }

    .song {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      column-gap: 16px;
      row-gap: 4px;
      margin-bottom: 16px;
      min-width: 0;
    }

    .title,
    .artist,
    .status {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .title,
    .artist {
      grid-column: 1;
    }

    .title {
      font-size: calc(27px * var(--scale) * var(--title-font-scale));
      font-weight: 700;
      line-height: 1.18;
    }

    .artist {
      color: var(--text-muted);
      font-size: calc(17px * var(--scale) * var(--artist-font-scale));
      line-height: 1.2;
    }

    .offset-badge {
      align-self: start;
      min-width: 86px;
      padding: 5px 8px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.18);
      color: var(--accent);
      font-size: calc(13px * var(--scale) * var(--offset-font-scale));
      font-weight: 800;
      line-height: 1.15;
      text-align: right;
      white-space: nowrap;
    }

    .song-badges {
      display: flex;
      grid-column: 2;
      grid-row: 1 / span 2;
      gap: 8px;
      align-items: flex-start;
      justify-content: flex-end;
    }

    .audio-match-badge {
      display: none;
      min-width: 86px;
      padding: 5px 8px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.18);
      color: var(--text-muted);
      font-size: calc(13px * var(--scale) * var(--offset-font-scale));
      font-weight: 800;
      line-height: 1.15;
      text-align: center;
      white-space: nowrap;
    }

    .audio-match-badge.is-visible { display: block; }
    .audio-match-badge.is-success { color: var(--accent); }
    .audio-match-badge.is-fallback { color: rgba(255, 255, 255, 0.62); }

    .lyrics-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 12px;
      gap: 8px;
      align-items: stretch;
    }

    .timeline {
      position: relative;
      width: 12px;
      min-height: var(--lyrics-height);
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
    }

    .timeline::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(to bottom, var(--timeline-top), var(--timeline-bottom));
      opacity: 0.32;
      filter: grayscale(0.85);
    }

    .timeline-fill {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: calc(var(--progress) * 100%);
      border-radius: 999px;
      background:
        linear-gradient(to bottom, var(--timeline-top), var(--timeline-bottom));
      background-size: 100% var(--lyrics-height);
      box-shadow: 0 0 14px rgba(132, 244, 208, 0.5);
      transition: height 110ms linear;
    }

    .lyrics {
      display: grid;
      position: relative;
      grid-template-rows: 1fr auto 1fr;
      gap: 8px;
      height: var(--lyrics-height);
      min-height: 132px;
      overflow: hidden;
      align-items: center;
    }

    .context {
      display: grid;
      gap: 6px;
      min-height: 0;
      overflow: hidden;
      align-content: center;
    }

    .line {
      display: -webkit-box;
      overflow: hidden;
      overflow-wrap: anywhere;
      word-break: break-word;
      white-space: normal;
      transform: translateY(var(--lyric-shift));
      transition: opacity 220ms ease, color 220ms ease, transform 220ms ease;
      -webkit-box-orient: vertical;
    }

    .lyrics.is-transitioning .line {
      opacity: 0;
      transform: translateY(var(--lyric-shift));
    }

    .line-ghost {
      position: absolute;
      margin: 0;
      pointer-events: none;
      z-index: 3;
    }

    .line.context-line {
      color: var(--text-muted);
      font-size: calc(20px * var(--scale) * var(--context-font-scale));
      line-height: 1.24;
      opacity: 0.78;
      -webkit-line-clamp: 1;
    }

    .line.current {
      position: relative;
      color: var(--text-main);
      font-size: calc(34px * var(--scale) * var(--lyric-font-scale));
      font-weight: 800;
      line-height: 1.16;
      -webkit-line-clamp: 2;
    }

    .current .lyric-progress-unit {
      color: rgba(255, 255, 255, var(--lyric-unplayed-opacity));
      transition: color 90ms linear;
    }

    .meta-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
      margin-top: 7px;
      min-width: 0;
    }

    .translation {
      display: -webkit-box;
      overflow: hidden;
      color: var(--accent);
      font-size: calc(20px * var(--scale) * var(--translation-font-scale));
      font-weight: 600;
      line-height: 1.25;
      overflow-wrap: anywhere;
      word-break: break-word;
      white-space: normal;
      opacity: 0.96;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .current-time {
      color: var(--accent);
      font-size: calc(13px * var(--scale) * var(--time-font-scale));
      font-weight: 800;
      line-height: 1.25;
      text-align: right;
      white-space: nowrap;
    }

    .status {
      margin-top: 12px;
      color: rgba(255, 255, 255, 0.62);
      font-size: calc(13px * var(--scale) * var(--status-font-scale));
      line-height: 1.2;
    }

    .overlay:not(.show-debug-status) .status {
      display: none;
    }

    @media (max-width: 960px) {
      .overlay {
        left: 28px;
        bottom: 32px;
        width: calc(100vw - 56px);
        max-height: calc(100vh - 64px);
      }

      :root {
        --scale: 0.86;
      }
    }

    @media (max-height: 520px) {
      .overlay {
        left: 28px;
        top: 24px;
        bottom: auto;
        width: min(var(--overlay-width), calc(100vw - 56px));
        max-height: calc(100vh - 48px);
      }
    }
  </style>
</head>
<body>
  <main class="overlay" aria-live="polite">
    <video id="mvBackground" class="mv-background" muted loop playsinline preload="metadata"></video>
    <section class="song">
      <div id="title" class="title">Waiting for beatmap data...</div>
      <div id="artist" class="artist"></div>
      <div class="song-badges">
        <div id="audioMatchBadge" class="audio-match-badge">识曲: 等待</div>
        <div id="offsetBadge" class="offset-badge">offset +0ms</div>
      </div>
    </section>

    <section class="lyrics-shell">
      <div class="lyrics">
        <div id="beforeLines" class="context"></div>
        <div>
          <div id="currentLine" class="line current">Waiting for tosu WebSocket data</div>
          <div class="meta-row">
            <div id="translation" class="translation"></div>
            <div id="currentTime" class="current-time">00:00.000</div>
          </div>
        </div>
        <div id="afterLines" class="context"></div>
      </div>
      <div class="timeline" aria-hidden="true">
        <div id="timelineFill" class="timeline-fill"></div>
      </div>
    </section>

    <div id="status" class="status">tosu websocket: connecting to 127.0.0.1:24050</div>
  </main>

  <script src="js/lyric-alignment.js?v=20260702-2"></script>
  <script src="js/afp.wasm.js?v=20260702-2"></script>
  <script src="js/afp.js?v=20260702-2"></script>
  <script>
    const CONFIG = {
      tosuWebSocket: "ws://127.0.0.1:24050/websocket/v2",
      neteaseApiBase: "http://127.0.0.1:3002",
      lyricOffsetMs: 0,
      audioMatchEnabled: true,
      audioMatchStartSeconds: -1,
      audioMatchDurationSeconds: 15,
      audioMatchMinOffsetMs: -40000,
      audioMatchMaxOffsetMs: 100000,
      audioMatchPitchPreserving: true,
      audioMatchMultiWindowEnabled: true,
      audioMatchAlwaysUseAllWindows: true,
      audioMatchConsensusOffsetMs: 200,
      autoOffsetFromFirstObject: false,
      autoOffsetMaxMs: 45000,
      autoOffsetLeadMs: 900,
      autoSpeedFromDifficulty: true,
      reuseSameSongSet: true,
      bpmTagAudioMatchEnabled: true,
      speedMultiplier: 1,
      retryDelayMs: 1200,
      searchLimit: 8,
      contextBefore: 2,
      contextAfter: 2,
      showTranslation: true,
      lyricTransitionMode: "fade",
      showAudioMatchBadge: true,
      showDebugStatus: true,
      songHeaderFormat: "two-line",
      lyricProgressEnabled: true,
      lyricProgressUnplayedOpacity: 0.46,
      customFontEnabled: false,
      customFontPath: "",
      titleFontScale: 1,
      artistFontScale: 1,
      lyricFontScale: 1.3,
      contextFontScale: 1.2,
      translationFontScale: 1,
      offsetFontScale: 1,
      timeFontScale: 1,
      statusFontScale: 1,
      overlayWidthPx: 900,
      lyricsHeightPx: 250,
      panelColor: "#090c12",
      panelOpacity: 0.5,
      panelColorMode: "beatmap",
      beatmapColorBlend: 0.72,
      autoAccentFromBeatmap: true,
      mvBackgroundEnabled: true,
      mvBackgroundResolution: 720,
      mvBackgroundOverlayOpacity: 0.5,
      mvBackgroundBrightness: 1,
      mvBackgroundOpacity: 0.7,
      mvBackgroundCropWidth: 0.78,
      mvBackgroundCropHeight: 0.9,
      bilibiliBackgroundEnabled: false,
      mvBackgroundSourcePriority: "netease",
      bilibiliMaxDurationDeviationPercent: 8,
      bilibiliSearchWithoutArtist: true,
      searchEndpoints: ["/search", "/cloudsearch"],
      fetchTimeoutMs: 4500,
      allowPostFallback: true,
      songCachePath: "song-cache.json",
      songCacheWriteEndpoint: "",
      aliasPath: "",
    };

    const titleEl = document.getElementById("title");
    const artistEl = document.getElementById("artist");
    const offsetBadgeEl = document.getElementById("offsetBadge");
    const audioMatchBadgeEl = document.getElementById("audioMatchBadge");
    const timelineFillEl = document.getElementById("timelineFill");
    const beforeLinesEl = document.getElementById("beforeLines");
    const currentLineEl = document.getElementById("currentLine");
    const currentTimeEl = document.getElementById("currentTime");
    const translationEl = document.getElementById("translation");
    const afterLinesEl = document.getElementById("afterLines");
    const statusEl = document.getElementById("status");
    const lyricsEl = document.querySelector(".lyrics");
    const overlayEl = document.querySelector(".overlay");
    const mvBackgroundEl = document.getElementById("mvBackground");

    let currentTrackKey = "";
    let lastSeenTrackKey = "";
    let pendingTrackKey = "";
    let pendingTrackPayload = null;
    let latestTrackPayload = null;
    let pendingTrackTimer = 0;
    let pendingTrackSince = 0;
    let lyricLines = [];
    let translatedLines = [];
    let loadedLyricsTrackKey = "";
    let loadingLyricsTrackKey = "";
    let lyricLoadToken = 0;
    let currentBackgroundKey = "";
    let currentDuration = 0;
    let currentSpeedMultiplier = 1;
    let currentTrackOffsetMs = 0;
    let currentAutoOffsetSource = "";
    let lastRenderedLyricIndex = -2;
    let lastTimelineBucket = -1;
    let lastLiveTime = 0;
    let lastSeenLiveTime = 0;
    let songCacheIndex = {};
    let externalAliases = {};
    let tosuSocket = null;
    let settingsSocket = null;
    let tosuReconnectTimer = 0;
    let settingsReconnectTimer = 0;
    let settingsLiveSyncTimer = 0;
    let tosuConnectionId = 0;
    let settingsConnectionId = 0;
    let audioMatchAbortController = null;
    let lyricTransitionTimer = 0;
    let customFontLoadKey = "";
    let currentLyricProgressUnits = [];
    let lastLyricProgressRenderAt = 0;
    let currentAudioMatchState = "idle";
    let currentAudioMatchConfidence = null;
    const sameSongSetResults = new Map();
    let currentMvBackgroundKey = "";
    let currentNeteaseSongId = "";
    let currentNeteaseSongMeta = { title: "", artist: "", durationMs: 0 };
    let mvBackgroundAbortController = null;
    let currentMvPlaybackPaused = false;
    let lastMvObservedLiveTime = null;
    let lastMvLiveAdvanceAt = 0;

    function clearDisplayedLyrics(message = "", options = {}) {
      lyricLines = [];
      translatedLines = [];
      if (!options.keepTrackState) {
        loadedLyricsTrackKey = "";
        loadingLyricsTrackKey = "";
      }
      lastRenderedLyricIndex = -2;
      lastTimelineBucket = -1;
      currentTrackOffsetMs = 0;
      currentAutoOffsetSource = "";
      updateOffsetBadge();
      clearTimeout(lyricTransitionTimer);
      lyricsEl?.classList.remove("is-transitioning");
      lyricsEl?.querySelectorAll(".line-ghost").forEach((element) => element.remove());
      beforeLinesEl.textContent = "";
      delete currentLineEl.dataset.lyricKey;
      delete currentLineEl.dataset.lyricText;
      currentLyricProgressUnits = [];
      lastLyricProgressRenderAt = 0;
      currentLineEl.textContent = message;
      currentLineEl.style.removeProperty("--lyric-progress");
      currentTimeEl.textContent = "";
      translationEl.textContent = "";
      afterLinesEl.textContent = "";
    }

    window.addEventListener("unhandledrejection", (event) => {
      event.preventDefault();
      setStatus(`handled async error: ${event.reason?.message || event.reason || "unknown"}`);
    });

    window.addEventListener("error", (event) => {
      setStatus(`page error: ${event.message || "unknown"}`);
    });

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function parseBool(value, fallback = false) {
      if (typeof value === "boolean") return value;
      if (typeof value === "number") return value !== 0;
      if (typeof value === "string") {
        const normalized = value.trim().toLowerCase();
        if (["true", "1", "yes", "enabled", "on"].includes(normalized)) return true;
        if (["false", "0", "no", "disabled", "off"].includes(normalized)) return false;
      }
      return fallback;
    }

    function parseNumber(value, fallback) {
      const number = Number(value);
      return Number.isFinite(number) ? number : fallback;
    }

    function normalizeSettingValue(value) {
      if (value && typeof value === "object") {
        if ("value" in value) return value.value;
        if ("selected" in value) return value.selected;
        if ("name" in value) return value.name;
        if ("label" in value) return value.label;
        if ("default" in value) return value.default;
      }
      return value;
    }

    function normalizeLyricTransitionMode(value) {
      if (value && typeof value === "object") value = normalizeSettingValue(value);

      const normalized = String(value ?? "").trim().toLowerCase();
      if (["0", "fade", "crossfade"].includes(normalized)) return "fade";
      if (["1", "roll", "slide", "rolling"].includes(normalized)) return "roll";
      if (["2", "off", "none", "disabled", "false"].includes(normalized)) return "off";
      if (normalized.includes("off") || normalized.includes("none") || normalized.includes("disabled")) return "off";
      if (normalized.includes("fade") || normalized.includes("crossfade")) return "fade";
      if (normalized.includes("roll") || normalized.includes("slide")) return "roll";

      return CONFIG.lyricTransitionMode;
    }

    function normalizeSettingsPayload(payload) {
      const source = payload?.settings || payload?.data || payload?.message || payload || {};
      const normalized = {};

      if (Array.isArray(source)) {
        for (const entry of source) {
          if (!entry?.uniqueID) continue;
          normalized[entry.uniqueID] = normalizeSettingValue(entry);
        }

        return normalized;
      }

      if (source && typeof source === "object" && source.uniqueID) {
        normalized[source.uniqueID] = normalizeSettingValue(source);
        return normalized;
      }

      if (source && typeof source === "object") {
        const nested = source.settings || source.data || source.message;
        if (nested && nested !== source) {
          const nestedSettings = normalizeSettingsPayload(nested);
          if (Object.keys(nestedSettings).length) return nestedSettings;
        }
      }

      for (const [key, value] of Object.entries(source)) {
        const normalizedValue = normalizeSettingValue(value);
        normalized[key] = normalizedValue;

        if (value && typeof value === "object" && value.uniqueID) {
          normalized[value.uniqueID] = normalizedValue;
        }
      }

      return normalized;
    }

    function applySettings(payload, options = {}) {
      const settings = normalizeSettingsPayload(payload);
      const previousSongCachePath = CONFIG.songCachePath;
      const previousAliasPath = CONFIG.aliasPath;
      const previousReloadKey = settingsReloadKey();
      const mapping = {
        neteaseApiBase: "string",
        lyricOffsetMs: "number",
        audioMatchEnabled: "boolean",
        audioMatchStartSeconds: "number",
        audioMatchDurationSeconds: "number",
        audioMatchMinOffsetMs: "number",
        audioMatchMaxOffsetMs: "number",
        audioMatchPitchPreserving: "boolean",
        audioMatchMultiWindowEnabled: "boolean",
        audioMatchAlwaysUseAllWindows: "boolean",
        audioMatchConsensusOffsetMs: "number",
        autoOffsetFromFirstObject: "boolean",
        autoOffsetMaxMs: "number",
        autoOffsetLeadMs: "number",
        autoSpeedFromDifficulty: "boolean",
        reuseSameSongSet: "boolean",
        bpmTagAudioMatchEnabled: "boolean",
        speedMultiplier: "number",
        searchLimit: "number",
        contextBefore: "number",
        contextAfter: "number",
        showTranslation: "boolean",
        lyricTransitionMode: "string",
        showAudioMatchBadge: "boolean",
        showDebugStatus: "boolean",
        songHeaderFormat: "string",
        lyricProgressEnabled: "boolean",
        lyricProgressUnplayedOpacity: "number",
        customFontEnabled: "boolean",
        customFontPath: "string",
        titleFontScale: "number",
        artistFontScale: "number",
        lyricFontScale: "number",
        contextFontScale: "number",
        translationFontScale: "number",
        offsetFontScale: "number",
        timeFontScale: "number",
        statusFontScale: "number",
        overlayWidthPx: "number",
        lyricsHeightPx: "number",
        panelColor: "string",
        panelOpacity: "number",
        panelColorMode: "string",
        beatmapColorBlend: "number",
        autoAccentFromBeatmap: "boolean",
        mvBackgroundEnabled: "boolean",
        mvBackgroundResolution: "number",
        mvBackgroundOverlayOpacity: "number",
        mvBackgroundBrightness: "number",
        mvBackgroundOpacity: "number",
        mvBackgroundCropWidth: "number",
        mvBackgroundCropHeight: "number",
        bilibiliBackgroundEnabled: "boolean",
        mvBackgroundSourcePriority: "string",
        bilibiliMaxDurationDeviationPercent: "number",
        bilibiliSearchWithoutArtist: "boolean",
        fetchTimeoutMs: "number",
        allowPostFallback: "boolean",
        songCachePath: "string",
        songCacheWriteEndpoint: "string",
        aliasPath: "string",
      };

      let changed = false;
      let recognized = false;

      for (const [key, type] of Object.entries(mapping)) {
        if (!(key in settings)) continue;

        recognized = true;
        let nextValue = CONFIG[key];
        if (type === "number") nextValue = parseNumber(settings[key], CONFIG[key]);
        else if (type === "boolean") nextValue = parseBool(settings[key], CONFIG[key]);
        else if (key === "lyricTransitionMode") nextValue = normalizeLyricTransitionMode(settings[key]);
        else if (key === "songHeaderFormat") {
          const value = String(settings[key]).toLowerCase();
          nextValue = ["1", "single-line", "single", "one-line"].includes(value) ? "single-line" : "two-line";
        }
        else if (key === "mvBackgroundSourcePriority") {
          nextValue = String(settings[key]).toLowerCase() === "bilibili" ? "bilibili" : "netease";
        }
        else nextValue = String(settings[key]);

        if (CONFIG[key] !== nextValue) {
          CONFIG[key] = nextValue;
          changed = true;
        }
      }

      if (!recognized || !changed) return false;

      applyVisualConfig();
      applyCustomFont();
      applyDebugStatusVisibility();
      if ("bilibiliBackgroundEnabled" in settings || "mvBackgroundSourcePriority" in settings || "bilibiliMaxDurationDeviationPercent" in settings || "bilibiliSearchWithoutArtist" in settings) {
        currentMvBackgroundKey = "";
      }
      if ("mvBackgroundEnabled" in settings || "mvBackgroundResolution" in settings || "bilibiliBackgroundEnabled" in settings || "mvBackgroundSourcePriority" in settings || "bilibiliMaxDurationDeviationPercent" in settings || "bilibiliSearchWithoutArtist" in settings) {
        refreshMvBackgroundForCurrentTrack();
      }
      updateAudioMatchBadge();
      updateSongHeaderFromLatestPayload();
      updateOffsetBadge();
      if (CONFIG.songCachePath !== previousSongCachePath) {
        loadSongCacheIndex();
      }
      if (CONFIG.aliasPath !== previousAliasPath) {
        loadSongAliases();
      }
      lastRenderedLyricIndex = -2;
      if (!options.silent) setStatus("settings: applied");
      if (settingsReloadKey() !== previousReloadKey) {
        refreshCurrentTrackAfterSettings();
      } else {
        renderLyrics(lastLiveTime);
      }

      return true;
    }

    function settingsReloadKey() {
      return JSON.stringify({
        neteaseApiBase: CONFIG.neteaseApiBase,
        lyricOffsetMs: CONFIG.lyricOffsetMs,
        audioMatchEnabled: CONFIG.audioMatchEnabled,

    function refreshCurrentTrackAfterSettings() {
      if (!latestTrackPayload) return;

    function hexToRgb(hex) {
      const match = String(hex || "").trim().match(/^#?([0-9a-f]{6})$/i);
      if (!match) return { r: 9, g: 12, b: 18 };

      const value = Number.parseInt(match[1], 16);
      return {
        r: (value >> 16) & 255,
        g: (value >> 8) & 255,
        b: value & 255,
      };
    }

    function rgbToHex(color) {
      return `#${[color.r, color.g, color.b]
        .map((value) => clamp(Math.round(value), 0, 255).toString(16).padStart(2, "0"))
        .join("")}`;
    }

    function blendColor(a, b, amount) {
      const ratio = clamp(Number(amount), 0, 1);

      return {
        r: a.r * (1 - ratio) + b.r * ratio,
        g: a.g * (1 - ratio) + b.g * ratio,
        b: a.b * (1 - ratio) + b.b * ratio,
      };
    }

    function readableAccent(color) {
      const boosted = {
        r: Math.min(255, color.r * 1.35 + 28),
        g: Math.min(255, color.g * 1.35 + 28),
        b: Math.min(255, color.b * 1.35 + 28),
      };

      return rgbToHex(blendColor(boosted, { r: 132, g: 244, b: 208 }, 0.35));
    }

    function luminance(color) {
      return 0.2126 * color.r + 0.7152 * color.g + 0.0722 * color.b;
    }

    function saturation(color) {
      const max = Math.max(color.r, color.g, color.b);
      const min = Math.min(color.r, color.g, color.b);
      return max === 0 ? 0 : (max - min) / max;
    }

    function vividScore(color) {
      return luminance(color) * 0.72 + saturation(color) * 255 * 0.38;
    }

    function hue(color) {
      const r = color.r / 255;
      const g = color.g / 255;
      const b = color.b / 255;
      const max = Math.max(r, g, b);
      const min = Math.min(r, g, b);
      const delta = max - min;

      if (!delta) return 0;
      if (max === r) return (60 * ((g - b) / delta) + 360) % 360;
      if (max === g) return 60 * ((b - r) / delta + 2);
      return 60 * ((r - g) / delta + 4);
    }

    function brightenColor(color, amount = 0.34) {
      return {
        r: color.r + (255 - color.r) * amount,
        g: color.g + (255 - color.g) * amount,
        b: color.b + (255 - color.b) * amount,
      };
    }

    function boostSaturation(color, amount = 0.22) {
      const gray = luminance(color);

      return {
        r: clamp(gray + (color.r - gray) * (1 + amount), 0, 255),
        g: clamp(gray + (color.g - gray) * (1 + amount), 0, 255),
        b: clamp(gray + (color.b - gray) * (1 + amount), 0, 255),
      };
    }

    function makeTimelineColor(color) {
      const luma = luminance(color);
      const brightenAmount = luma < 76 ? 0.52 : luma < 128 ? 0.38 : 0.24;
      return boostSaturation(brightenColor(color, brightenAmount), 0.34);
    }

    function paletteBucketKey(color) {
      const h = Math.round(hue(color) / 18);
      const s = Math.round(saturation(color) * 5);
      const l = Math.round(luminance(color) / 32);
      return `${h}:${s}:${l}`;
    }

    function addPaletteSample(buckets, color) {
      const sat = saturation(color);
      const luma = luminance(color);
      if (luma < 24 || luma > 244 || sat < 0.08) return;

      const key = paletteBucketKey(color);
      const bucket = buckets.get(key) || { r: 0, g: 0, b: 0, count: 0, score: 0 };
      const weight = 1 + sat * 2.4 + Math.min(luma, 210) / 210;

      bucket.r += color.r * weight;
      bucket.g += color.g * weight;
      bucket.b += color.b * weight;
      bucket.count += weight;
      bucket.score += weight;
      buckets.set(key, bucket);
    }

    function dominantPalette(buckets, fallback) {
      const colors = [...buckets.values()]
        .filter((bucket) => bucket.count > 0)
        .map((bucket) => {
          const color = {
            r: bucket.r / bucket.count,
            g: bucket.g / bucket.count,
            b: bucket.b / bucket.count,
          };

          return {
            color,
            score: bucket.score * (0.75 + saturation(color)) * (0.72 + Math.min(luminance(color), 210) / 255),
          };
        })
        .sort((a, b) => b.score - a.score);

      const primary = colors[0]?.color || fallback;
      const secondary = colors.find((item) => colorDistance(item.color, primary) >= 58)?.color
        || colors[1]?.color
        || fallback;

      return { primary, secondary };
    }

    function colorDistance(a, b) {
      return Math.sqrt(
        (a.r - b.r) ** 2 +
        (a.g - b.g) ** 2 +
        (a.b - b.b) ** 2,
      );
    }

    function separateGradientEnds(top, bottom) {
      if (colorDistance(top, bottom) >= 72) {
        return { top, bottom };
      }

      const cool = blendColor(top, { r: 112, g: 190, b: 255 }, 0.32);
      const warm = blendColor(bottom, { r: 255, g: 214, b: 112 }, 0.24);

      return {
        top: makeTimelineColor(cool),
        bottom: makeTimelineColor(warm),
      };
    }

    function resetCustomFont() {

    async function applyCustomFont() {
      const path = String(CONFIG.customFontPath || "").trim();
      const enabled = Boolean(CONFIG.customFontEnabled && path);
      const loadKey = enabled ? path : "";
      if (loadKey === customFontLoadKey) return;
      customFontLoadKey = loadKey;

      if (!enabled) {
        resetCustomFont();
        return;
      }

      try {
        const url = new URL(encodeURI(path.replace(/\\/g, "/")), window.location.href).toString();
        const family = "tosu-custom-lyrics-font";
        const font = new FontFace(family, `url("${url}") format("truetype")`);
        const loaded = await font.load();
        if (customFontLoadKey !== loadKey) return;
        document.fonts.add(loaded);
        document.documentElement.style.setProperty("--overlay-font", `"${family}", "Segoe UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif`);
      } catch (error) {
        if (customFontLoadKey !== loadKey) return;
        resetCustomFont();
        setStatus(`custom font unavailable: ${error.message || path}`);
      }
    }

    function updateSongHeader(title, artist) {
      const safeTitle = title || "Unknown title";
      const safeArtist = artist || "Unknown artist";
      const singleLine = CONFIG.songHeaderFormat === "single-line";
      const nextTitle = singleLine ? `${safeTitle} / ${safeArtist}` : safeTitle;

    function updateSongHeaderFromLatestPayload() {

      updateSongHeader(info.rawTitle, info.rawArtist);

    function safeText(value) {
      return String(value || "").replace(/\s+/g, " ").trim();
    }

    function normalizeForSearch(value) {
      return safeText(value)
        .replace(/\[[^\]]*]/g, " ")
        .replace(/\([^)]*(?:TV Size|Short Ver\.?|Game Ver\.?|Cut Ver\.?|Extended|feat\.[^)]*)\)/gi, " ")
        .replace(/\b(TV Size|Short Ver\.?|Game Ver\.?|Cut Ver\.?|Extended|Mapped by .*)\b/gi, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function normalizeForCompare(value) {
      return normalizeForSearch(value)
        .toLowerCase()
        .replace(/[^\p{L}\p{N}]+/gu, "");
    }

    function uniqueStrings(values) {
      const seen = new Set();
      const output = [];

      for (const value of values.map(safeText).filter(Boolean)) {
        const key = value.toLowerCase();
        if (seen.has(key)) continue;

        seen.add(key);
        output.push(value);
      }

      return output;
    }

    function titleVariants(title) {
      const original = safeText(title);
      const cleaned = normalizeForSearch(original);
      const noParens = original.replace(/\([^)]*\)/g, " ").replace(/\[[^\]]*]/g, " ").replace(/\s+/g, " ").trim();
      const beforeDash = original.split(/\s+-\s+|\s+[~]\s+/)[0];

      return uniqueStrings([original, cleaned, noParens, beforeDash]);
    }

    function isPackTitle(title) {
      return /\b(pack|packs|collection|collections|practice|ln\s*feast|favorite\s*song\s*9?|zhong\s*wen\s*die\s*bao\s*#?\s*\d*|jack\s*house'?s|acg\s*fantasy|malody\s*4k|compilation|anthlogy|anthology|lnex\s*\d+)\b/i.test(safeText(title));
    }

    function isPackBeatmap(beatmap = {}) {
      return isPackTitle(beatmap.titleUnicode || "") || isPackTitle(beatmap.title || "");
    }

    function difficultyBpmTag(version) {
      const match = safeText(version).match(/[\[\u3010]\s*(\d{2,3})\s*[\]\u3011]/);
      const bpm = Number(match?.[1]);
      return Number.isFinite(bpm) && bpm >= 60 && bpm <= 400 ? bpm : 0;
    }

    function neteaseSongBpm(song = {}) {
      const bpm = Number(song.bpm || song.tempo || song.metadata?.bpm || 0);
      return Number.isFinite(bpm) && bpm >= 40 && bpm <= 500 ? bpm : 0;
    }

    function bpmDifficultyMultiplier(beatmap = {}, neteaseBpm = 0) {
      if (!CONFIG.bpmTagAudioMatchEnabled || isPackBeatmap(beatmap)) return 1;
      const taggedBpm = difficultyBpmTag(beatmap.version);
      const sourceBpm = Number(neteaseBpm);
      if (!taggedBpm || !Number.isFinite(sourceBpm) || sourceBpm <= 0) return 1;
      return clamp(taggedBpm / sourceBpm, 0.5, 2.5);
    }

    function stripBracketedText(value) {
      return safeText(value)
        .replace(/\([^)]*\)/g, " ")
        .replace(/\[[^\]]*]/g, " ")
        .replace(/\u3010[^\u3011]*\u3011/g, " ")
        .replace(/\uFF08[^\uFF09]*\uFF09/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function removeDifficultyDecorations(value) {
      return safeText(value)
        .replace(/^\s*(?:easy|normal|hard|insane|expert|extra|extreme|master|lunatic|another|hyper|append|challenge|collab|marathon|finale)\s*[:\uFF1A-]\s*/i, "")
        .replace(/^\s*\d+\s*[:\uFF1A).-]\s*/, "")
        .replace(/\b(?:\d+(?:\.\d+)?\s*x|x\s*\d+(?:\.\d+)?)\b/gi, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function removeMapperSuffix(value) {
      return safeText(value)
        .replace(/\s+(?:mapped\s+)?by\s+[^-~|/]+$/i, "")
        .replace(/\s+[~]\s+[^-~|/]+$/i, "")
        .replace(/\s*[-\u2013\u2014]\s*(?:mapped\s+)?by\s+.+$/i, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function looksLikeArtistTitle(value) {
      const text = safeText(value);
      if (!text || text.length > 220) return false;
      return /^.{1,90}?\s*[-\u2013\u2014\uff0d]\s*.{1,130}$/.test(text);
    }

    function removeMapperPrefix(value) {
      const text = safeText(value);
      const parts = text.split(/\s*\/\/\s*/).map(safeText).filter(Boolean);
      if (parts.length < 2) return text;

      const left = parts[0];
      const right = parts.slice(1).join(" // ").trim();
      const leftLooksSong = looksLikeArtistTitle(left);
      const rightLooksSong = looksLikeArtistTitle(right);

      if (leftLooksSong && !rightLooksSong) return left;
      if (rightLooksSong && !leftLooksSong) return right;
      if (rightLooksSong) return right;

      return right.length >= left.length ? right : left;
    }

    const builtInAliases = {
      hakkenshawatashi: ["\u767a\u898b\u8005\u306f\u30ef\u30bf\u30b7"],
      tapimiruhakkenshawatashi: ["\u767a\u898b\u8005\u306f\u30ef\u30bf\u30b7"],
      hakkenshawatashitapimiru: ["\u767a\u898b\u8005\u306f\u30ef\u30bf\u30b7"],
      wodeguozhifenniyiban: ["\u6211\u7684\u679c\u6c41\u5206\u4f60\u4e00\u534a"],
      wodeguozhifenniyibanflowers: ["\u6211\u7684\u679c\u6c41\u5206\u4f60\u4e00\u534a"],
      flowerswodeguozhifenniyiban: ["\u6211\u7684\u679c\u6c41\u5206\u4f60\u4e00\u534a"],
      guozhifenniyiban: ["\u6211\u7684\u679c\u6c41\u5206\u4f60\u4e00\u534a"],
    };

    function mergedAliases() {
      return { ...builtInAliases, ...(externalAliases || {}) };
    }

    function aliasLookupKeys(title, artist) {
      const baseValues = [
        title,
        `${title}${artist}`,
        `${artist}${title}`,
      ];
      const keys = [];

      for (const value of baseValues) {
        const normalized = normalizeForCompare(value);
        if (!normalized) continue;

        keys.push(normalized);
        const tokens = normalizeForSearch(value).toLowerCase().match(/[\p{L}\p{N}]+/gu) || [];
        const withoutParticles = tokens
          .filter((token) => !["wa", "ha", "no", "wo", "o", "ni", "de", "to", "ga", "e"].includes(token))
          .join("");
        if (withoutParticles) keys.push(withoutParticles);
      }

      return uniqueStrings(keys);
    }

    function aliasVariants(title, artist) {
      const aliasesByKey = mergedAliases();
      const keys = aliasLookupKeys(title, artist);
      const aliases = [];

      for (const key of keys) {
        if (aliasesByKey[key]) aliases.push(...aliasesByKey[key]);
      }

      return uniqueStrings(aliases);
    }

    function parseArtistTitle(value) {
      const text = safeText(value);
      const match = text.match(/^(.{1,80}?)\s*[-\u2013\u2014]\s*(.{1,120})$/);
      if (!match) return null;

      const artist = safeText(match[1]);
      const title = safeText(match[2]);
      if (!artist || !title) return null;

      return { title, artist };
    }

    function beatmapMetadata(payload = {}) {
      const beatmap = payload.beatmap || payload.menu?.bm || payload.menu?.beatmap || {};
      const metadata = beatmap.metadata || payload.menu?.bm?.metadata || {};

      return {
        ...beatmap,
        titleUnicode: beatmap.titleUnicode || beatmap.titleOriginal || metadata.titleOriginal || metadata.titleUnicode,
        title: beatmap.title || metadata.title || metadata.titleRoman || metadata.titleRomanized,
        artistUnicode: beatmap.artistUnicode || beatmap.artistOriginal || metadata.artistOriginal || metadata.artistUnicode,
        artist: beatmap.artist || metadata.artist || metadata.artistRoman || metadata.artistRomanized,
        version: beatmap.version || beatmap.difficulty || metadata.difficulty || metadata.version,
        checksum: beatmap.checksum || beatmap.md5 || beatmap.hash || metadata.checksum || metadata.md5,
      };
    }

    function deriveSearchMetaFromBeatmap(beatmap) {
      const rawTitle = safeText(beatmap.titleUnicode || beatmap.title);
      const rawRomanTitle = safeText(beatmap.title || rawTitle);
      const rawArtist = safeText(beatmap.artistUnicode || beatmap.artist);
      const version = safeText(beatmap.version);

      if (!isPackTitle(rawTitle) && !isPackTitle(rawRomanTitle)) {
        return {
          displayTitle: rawTitle,
          displayArtist: rawArtist,
          searchTitle: rawTitle,
          searchArtist: rawArtist,
          source: "beatmap",
        };
      }

      const cleanedVersion = removeMapperSuffix(removeMapperPrefix(removeDifficultyDecorations(stripBracketedText(version))));
      const parsed = parseArtistTitle(cleanedVersion);
      const searchTitle = parsed?.title || cleanedVersion || rawTitle;
      const searchArtist = parsed?.artist || "";

      return {
        displayTitle: searchTitle,
        displayArtist: searchArtist || rawArtist,
        searchTitle,
        searchArtist,
        source: "difficulty",
      };
    }

    function trackInfoFromPayload(payload = {}) {
      const beatmap = beatmapMetadata(payload);
      const meta = deriveSearchMetaFromBeatmap(beatmap);
      const searchTitle = meta.searchTitle;
      const searchArtist = meta.searchArtist;

      return {
        beatmap,
        meta,
        rawTitle: meta.displayTitle,
        rawArtist: meta.displayArtist,
        searchTitle,
        searchArtist,
        key: trackIdentityKey(beatmap, searchTitle, searchArtist),
      };
    }

    function searchQueries(title, artist) {
      const titles = uniqueStrings([...aliasVariants(title, artist), ...titleVariants(title)]);
      const cleanArtist = normalizeForSearch(artist);
      const queries = [];

      for (const item of titles) {
        if (cleanArtist) queries.push(`${item} ${cleanArtist}`);
        queries.push(item);
      }

      return uniqueStrings(queries);
    }

    function validOnlineId(value) {
      const text = safeText(value);
      if (!text) return "";

      const number = Number(text);
      if (Number.isFinite(number) && number > 0) return String(Math.trunc(number));

      return "";
    }

    function firstValidOnlineId(...values) {
      for (const value of values) {
        const id = validOnlineId(value);
        if (id) return id;
      }

      return "";
    }

    function beatmapDifficultyId(beatmap = {}) {
      return firstValidOnlineId(
        beatmap.id,
        beatmap.beatmapId,
        beatmap.beatmapID,
        beatmap.onlineId,
        beatmap.onlineID,
        beatmap.beatmap_id,
        beatmap.metadata?.beatmapId,
        beatmap.metadata?.beatmapID
      );
    }

    function beatmapSetId(beatmap = {}) {
      return firstValidOnlineId(
        beatmap.setId,
        beatmap.setID,
        beatmap.beatmapSetId,
        beatmap.beatmapSetID,
        beatmap.beatmapsetId,
        beatmap.beatmapsetID,
        beatmap.beatmapset_id,
        beatmap.metadata?.beatmapSetId,
        beatmap.metadata?.beatmapsetId
      );
    }

    function sameSongSetReuseKey(beatmap = {}) {
      if (!CONFIG.reuseSameSongSet || isPackBeatmap(beatmap)) return "";
      const setId = beatmapSetId(beatmap);
      if (setId) return `set:${setId}`;

      const folder = safeText(
        beatmap.path?.folder
        || beatmap.folders?.beatmap
        || beatmap.files?.folder
        || beatmap.folder,
      );
      if (folder) return `folder:${folder}`;

      const audio = safeText(
        beatmap.audio
        || beatmap.audioFile
        || beatmap.audioFilename
        || beatmap.files?.audio
        || beatmap.files?.mp3
        || beatmap.path?.audio
        || beatmap.path?.mp3,
      );
      if (audio) return `audio:${audio}`;

      const mapPath = safeText(beatmap.path?.full || beatmap.filename || beatmap.file || beatmap.files?.osu);
      const parentPath = mapPath.replace(/[\\/][^\\/]+$/, "");
      if (parentPath) return `folder:${parentPath}`;

      const title = normalizeForCompare(beatmap.titleUnicode || beatmap.title || "");
      const artist = normalizeForCompare(beatmap.artistUnicode || beatmap.artist || "");
      return title ? `metadata:${artist}::${title}` : "";
    }

    function rememberSameSongSetResult(beatmap, result) {
      const key = sameSongSetReuseKey(beatmap);
      if (!key || !result?.neteaseSongId) return;

      sameSongSetResults.delete(key);
      sameSongSetResults.set(key, {
        ...result,
        lines: result.lines || [],
        translations: result.translations || [],
      });
      while (sameSongSetResults.size > 12) {
        sameSongSetResults.delete(sameSongSetResults.keys().next().value);
      }
    }

    function sameSongSetResult(beatmap) {
      const key = sameSongSetReuseKey(beatmap);
      const saved = key ? sameSongSetResults.get(key) : null;
      if (!saved) return null;

      sameSongSetResults.delete(key);
      sameSongSetResults.set(key, saved);
      return {
        ...saved,
        lines: saved.lines || [],
        translations: saved.translations || [],
        source: `set reuse ${saved.neteaseSongId}`,
        speedMultiplier: 1,
      };
    }

    function trackKeys(title, artist, beatmap = {}) {
      const checksum = safeText(beatmap.checksum);
      const difficultyId = beatmapDifficultyId(beatmap);
      const setId = beatmapSetId(beatmap);
      return uniqueStrings([
        difficultyId && `beatmap:${difficultyId}`,
        setId && `set:${setId}`,
        checksum,
        `${normalizeForCompare(artist)}::${normalizeForCompare(title)}`,
        normalizeForCompare(title),
      ].filter(Boolean));
    }

    function strictTrackKeys(beatmap = {}) {
      const checksum = safeText(beatmap.checksum);
      const difficultyId = beatmapDifficultyId(beatmap);

      return uniqueStrings([
        difficultyId && `beatmap:${difficultyId}`,
        checksum,
      ].filter(Boolean));
    }

    function trackIdentityKey(beatmap = {}, title = "", artist = "") {
      const metadata = beatmap.metadata || {};
      const files = beatmap.files || {};
      const pathInfo = beatmap.path || {};
      const folders = beatmap.folders || {};

      return uniqueStrings([
        ...strictTrackKeys(beatmap),
        beatmapSetId(beatmap) && `set:${beatmapSetId(beatmap)}`,
        safeText(beatmap.audio || beatmap.audioFile || beatmap.audioFilename || files.audio || files.mp3),
        safeText(beatmap.filename || beatmap.file || files.osu || pathInfo.file || pathInfo.full),
        safeText(pathInfo.audio || pathInfo.mp3 || pathInfo.folder || folders.beatmap),
        normalizeForCompare(artist),
        normalizeForCompare(title),
        safeText(beatmap.version || metadata.version || metadata.difficulty),
      ].filter(Boolean)).join("::");
    }

    function getSongCacheEntry(title, artist, beatmap) {
      const keys = trackKeys(title, artist, beatmap);
      const tracks = songCacheIndex.tracks || {};

      for (const key of keys) {
        if (!key || !tracks[key]) continue;
        const entry = tracks[key];
        if (key.startsWith("set:") && !entry.manual) continue;
        if (!key.startsWith("beatmap:") && key !== safeText(beatmap.checksum) && !entry.manual) continue;
        return entry;
      }

      return null;
    }

    function isAutoOffsetEntry(entry) {
      return Boolean(entry?.autoOffsetSource || entry?.audioMatchSource || parseNumber(entry?.autoOffsetMs, 0) !== 0);
    }

    function audioMatchOffsetInRange(offset) {
      const value = parseNumber(offset, 0);
      return value >= CONFIG.audioMatchMinOffsetMs && value <= CONFIG.audioMatchMaxOffsetMs;
    }

    function cacheLyricOffset(entry) {
      if (!entry) return 0;
      const offset = parseNumber(entry.lyricOffsetMs, 0);
      if (entry.audioMatchSource) return CONFIG.audioMatchEnabled && audioMatchOffsetInRange(offset) ? offset : 0;
      if (!isAutoOffsetEntry(entry)) return offset;
      return CONFIG.autoOffsetFromFirstObject ? offset : 0;
    }

    async function writeSongCacheIndex(title, artist, beatmap, result) {
      if (!CONFIG.songCacheWriteEndpoint || !result?.neteaseSongId || !result?.lines?.length) return;

      const keys = strictTrackKeys(beatmap);
      if (!keys.length) return;

      const payload = {
        keys,
        primaryKey: keys[0] || "",
        neteaseSongId: result.neteaseSongId,
        neteaseDurationMs: parseNumber(result.neteaseDurationMs, 0),
        neteaseBpm: parseNumber(result.neteaseBpm, 0),
        title,
        artist,
        beatmapId: beatmapDifficultyId(beatmap),
        beatmapSetId: beatmapSetId(beatmap),
        checksum: beatmap.checksum || "",
        lyricOffsetMs: parseNumber(result.lyricOffsetMs, 0),
        speedMultiplier: parseNumber(result.speedMultiplier, 1),
        autoOffsetMs: parseNumber(result.autoOffsetMs, 0),
        autoOffsetSource: result.autoOffsetSource || "",
        audioMatchSource: result.audioMatchSource || "",
        audioMatchStartTimeMs: parseNumber(result.audioMatchStartTimeMs, 0),
        audioMatchSampleStartMs: parseNumber(result.audioMatchSampleStartMs, 0),
        audioMatchEffectiveSampleStartMs: parseNumber(result.audioMatchEffectiveSampleStartMs, 0),
        audioMatchSpeed: parseNumber(result.audioMatchSpeed, 1),
        audioMatchConfidence: result.audioMatchConfidence || "",
        firstLyricTimeMs: parseNumber(result.firstLyricTimeMs, 0),
        firstObjectTimeMs: parseNumber(result.firstObjectTimeMs, 0),
        source: result.source || "",
      };

      try {
        await requestJson(CONFIG.songCacheWriteEndpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json;charset=UTF-8" },
          body: JSON.stringify(payload),
        });
        if (payload.primaryKey) {
          songCacheIndex.tracks ||= {};
          songCacheIndex.tracks[payload.primaryKey] = payload;
        }
      } catch {
        // Static counters can run without a cache writer.
      }
    }

    async function loadSongCacheIndex() {
      try {
        const response = await fetch(CONFIG.songCachePath, { cache: "no-store" });
        if (!response.ok) {
          songCacheIndex = {};
          return;
        }
        const cache = await response.json();
        songCacheIndex = cache && typeof cache === "object" ? cache : {};
      } catch {
        songCacheIndex = {};
      }
    }

    async function loadSongAliases() {
      if (!CONFIG.aliasPath) {
        externalAliases = {};
        return;
      }

      try {
        const response = await fetch(CONFIG.aliasPath, { cache: "no-store" });
        if (!response.ok) {
          externalAliases = {};
          return;
        }
        const aliases = await response.json();
        externalAliases = aliases && typeof aliases === "object" ? aliases : {};
      } catch {
        externalAliases = {};
      }
    }

    async function loadSettingsFile() {
      try {
        const response = await fetch("./settings.json", { cache: "no-store" });
        if (!response.ok) return;
        applySettings(await response.json(), { silent: true });
      } catch {
        // The command channel can still provide settings later.
      }
    }

    function rawCounterPath() {
      if (typeof window.COUNTER_PATH === "string" && window.COUNTER_PATH.trim()) {
        return window.COUNTER_PATH;
      }

      return `${location.pathname || "/"}${location.search || ""}`;
    }

    function getCounterPathForCommand() {
      return encodeURI(rawCounterPath());
    }

    function getCounterPathForQuery() {
      return encodeURIComponent(rawCounterPath());
    }

    function backgroundCandidates(beatmap, payload = {}) {
      const directPath = payload.directPath || {};
      const files = payload.files || {};
      const folders = payload.folders || {};
      const stableEndpoint = "/files/beatmap/background";
      const raw = [
        stableEndpoint,
        directPath.beatmapBackground,
        directPath.beatmapFolder && files.background ? `${directPath.beatmapFolder}/${files.background}` : "",
        folders.beatmap && files.background ? `${folders.beatmap}/${files.background}` : "",
        files.background,
        beatmap.background,
        beatmap.backgroundImage,
        beatmap.bg,
        beatmap.path?.background,
        beatmap.path?.bg,
        beatmap.path?.full,
        beatmap.path?.folder,
        beatmap.folder,
        beatmap.folders?.beatmap,
        beatmap.folders?.songs,
        beatmap.files?.background,
        beatmap.assets?.background,
      ].filter(Boolean).map(String);

      const candidates = [];

      for (const item of raw) {
        const isStableEndpoint = item === stableEndpoint || item.startsWith("/files/beatmap/");
        const isImagePath = /\.(jpg|jpeg|png|webp|gif)$/i.test(item);
        const isRootTemporaryPath = item.startsWith("/") && !isStableEndpoint;
        if (isRootTemporaryPath) continue;
        if (!isStableEndpoint && !isImagePath) continue;

        candidates.push(item);
        if (!isImagePath) continue;
        candidates.push(`/Songs/${item}`);
        candidates.push(`/files/beatmap/${item}`);
        candidates.push(`/files/beatmap/background/${item}`);
      }

      const filename = files.background || beatmap.files?.background || beatmap.background || beatmap.bg;
      const folderCandidates = [folders.beatmap, beatmap.path?.folder, beatmap.folder, beatmap.folders?.beatmap].filter(Boolean).map(String);

      for (const folder of folderCandidates) {
        if (folder.startsWith("/") && !folder.startsWith("/files/beatmap/")) continue;
        if (filename) {
          candidates.push(`${folder}/${filename}`);
          candidates.push(`/Songs/${folder}/${filename}`);
          candidates.push(`/files/beatmap/${folder}/${filename}`);
        }
      }

      return uniqueStrings(candidates);
    }

    function toImageUrl(path) {
      if (/^(https?:|data:|blob:)/i.test(path)) return path;
      if (path.startsWith("/")) return path;

      const normalizedPath = path.replaceAll("\\", "/");
      const songsIndex = normalizedPath.toLowerCase().lastIndexOf("/songs/");
      if (songsIndex >= 0) {
        return `/files/beatmap/${normalizedPath.slice(songsIndex + "/songs/".length)}`;
      }

      if (!/\.(jpg|jpeg|png|webp|gif)$/i.test(normalizedPath)) {
        return `/files/beatmap/${normalizedPath}`;
      }

      try {
        return new URL(normalizedPath, location.origin).toString();
      } catch {
        return path;
      }
    }

    function toBeatmapFileUrl(path) {
      if (!path) return "";
      if (/^(https?:|data:|blob:)/i.test(path)) return path;

      const normalizedPath = String(path).replaceAll("\\", "/");
      if (normalizedPath.startsWith("/")) {
        if (normalizedPath.startsWith("/files/beatmap/") || /\.osu(?:[?#].*)?$/i.test(normalizedPath)) return normalizedPath;
        return "";
      }

      const songsIndex = normalizedPath.toLowerCase().lastIndexOf("/songs/");
      if (songsIndex >= 0) {
        return `/files/beatmap/${normalizedPath.slice(songsIndex + "/songs/".length)}`;
      }

      if (/\.osu$/i.test(normalizedPath)) {
        return `/files/beatmap/${normalizedPath}`;
      }

      return "";
    }

    function beatmapFileCandidates(beatmap = {}, payload = {}) {
      const directPath = payload.directPath || {};
      const files = payload.files || beatmap.files || {};
      const pathInfo = beatmap.path || {};

      return uniqueStrings([
        "/files/beatmap/file",
        directPath.beatmapFile,
        directPath.beatmap,
        files.beatmap,
        files.osu,
        files.file,
        beatmap.file,
        beatmap.filename,
        pathInfo.file,
        pathInfo.full,
      ].filter(Boolean).map(toBeatmapFileUrl).filter(Boolean));
    }

    async function fetchText(path) {
      const timeout = timeoutSignal(CONFIG.fetchTimeoutMs);

      try {
        const response = await fetch(path, {
          cache: "no-store",
          mode: "cors",
          signal: timeout.signal,
        });

        if (!response.ok) throw new Error(`${path} returned ${response.status}`);
        return response.text();
      } finally {
        timeout.done?.();
      }
    }

    async function fetchArrayBuffer(path, signal = null) {
      const timeout = timeoutSignal(Math.max(CONFIG.fetchTimeoutMs, 15000));
      let abortHandler = null;

      try {
        if (signal?.aborted) throw new Error("request aborted");
        if (signal) {
          abortHandler = () => timeout.abort?.();
          signal.addEventListener("abort", abortHandler, { once: true });
        }

        const response = await fetch(path, {
          cache: "no-store",
          mode: "cors",
          signal: timeout.signal,
        });

        if (!response.ok) throw new Error(`${path} returned ${response.status}`);
        return response.arrayBuffer();
      } catch (error) {
        if (signal?.aborted) throw new Error("audio match aborted");
        throw error;
      } finally {
        if (signal && abortHandler) signal.removeEventListener("abort", abortHandler);
        timeout.done?.();
      }
    }

    function toTosuHttpBase() {
      try {
        const url = new URL(CONFIG.tosuWebSocket);
        url.protocol = url.protocol === "wss:" ? "https:" : "http:";
        url.pathname = "/";
        url.search = "";
        url.hash = "";
        return url.toString();
      } catch {
        return "http://127.0.0.1:24050/";
      }
    }

    function toTosuUrl(path) {
      return new URL(path, toTosuHttpBase()).toString();
    }

    async function currentBeatmapAudioBuffer(signal = null) {
      return fetchArrayBuffer(toTosuUrl("/files/beatmap/audio"), signal);
    }

    function throwIfAudioMatchAborted(signal) {
      if (signal?.aborted) throw new Error("audio match aborted");
    }

    async function decodeAudioBuffer(buffer, outputSampleRate = 8000) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) throw new Error("AudioContext unavailable");

      const context = outputSampleRate
        ? new AudioContextClass({ sampleRate: outputSampleRate })
        : new AudioContextClass();
      try {
        return await context.decodeAudioData(buffer.slice(0));
      } finally {
        context.close?.();
      }
    }

    function audioMatchSamples(audioBuffer, startSeconds, durationSeconds) {
      const sampleRate = audioBuffer.sampleRate || 8000;
      const channel = audioBuffer.getChannelData(0);
      const start = Math.max(0, Math.floor(startSeconds * sampleRate));
      const count = Math.max(sampleRate, Math.floor(durationSeconds * sampleRate));
      const end = Math.min(channel.length, start + count);
      if (end <= start) throw new Error("audio match sample range is outside current audio");
      return new Float32Array(channel.subarray(start, end));
    }

    function audioMatchWindow(audioBuffer, configuredStartSeconds, configuredDurationSeconds, speed) {
      const totalSeconds = audioBuffer.duration || audioBuffer.length / (audioBuffer.sampleRate || 8000);
      const safeSpeed = Number.isFinite(Number(speed)) && Number(speed) > 0 ? Number(speed) : 1;
      const targetTotalSeconds = totalSeconds * safeSpeed;
      const useMiddleWindow = Number(configuredStartSeconds) < 0;
      const targetDurationSeconds = useMiddleWindow ? 15 : configuredDurationSeconds;
      const safeTargetDurationSeconds = clamp(targetDurationSeconds, 3, 30);
      const targetStartSeconds = useMiddleWindow
        ? Math.max(0, targetTotalSeconds / 2 - safeTargetDurationSeconds / 2)
        : Math.max(0, configuredStartSeconds);
      const actualDurationSeconds = Math.min(totalSeconds, Math.max(1, safeTargetDurationSeconds / safeSpeed));
      let actualStartSeconds = Math.max(0, targetStartSeconds / safeSpeed);

      if (actualStartSeconds + actualDurationSeconds > totalSeconds) {
        actualStartSeconds = Math.max(0, totalSeconds - actualDurationSeconds);
      }

      return {
        actualStartSeconds,
        actualDurationSeconds,
        targetStartSeconds: actualStartSeconds * safeSpeed,
        targetDurationSeconds: actualDurationSeconds * safeSpeed,
        useMiddleWindow,
        totalSeconds,
      };
    }

    function audioMatchWindowAtFraction(audioBuffer, fraction, durationSeconds, speed) {
      const totalSeconds = audioBuffer.duration || audioBuffer.length / (audioBuffer.sampleRate || 8000);
      const safeSpeed = Number.isFinite(Number(speed)) && Number(speed) > 0 ? Number(speed) : 1;
      const targetTotalSeconds = totalSeconds * safeSpeed;
      const requestedDuration = clamp(Number(durationSeconds) || 15, 3, 30);
      const actualDurationSeconds = Math.min(totalSeconds, Math.max(1, requestedDuration / safeSpeed));
      const targetDurationSeconds = actualDurationSeconds * safeSpeed;
      const center = clamp(Number(fraction), 0, 1) * targetTotalSeconds;
      const targetStartSeconds = clamp(center - targetDurationSeconds / 2, 0, Math.max(0, targetTotalSeconds - targetDurationSeconds));

      return {
        actualStartSeconds: targetStartSeconds / safeSpeed,
        actualDurationSeconds,
        targetStartSeconds,
        targetDurationSeconds,
        totalSeconds,
        fraction: clamp(Number(fraction), 0, 1),
      };
    }

    function stretchSamplesForSpeed(samples, speed) {
      const safeSpeed = Number.isFinite(Number(speed)) && Number(speed) > 0 ? Number(speed) : 1;
      if (Math.abs(safeSpeed - 1) < 0.01) return samples;

      const length = Math.max(1, Math.round(samples.length * safeSpeed));
      const output = new Float32Array(length);

      for (let index = 0; index < length; index += 1) {
        const sourceIndex = index / safeSpeed;
        const left = Math.floor(sourceIndex);
        const right = Math.min(samples.length - 1, left + 1);
        const ratio = sourceIndex - left;
        output[index] = samples[left] * (1 - ratio) + samples[right] * ratio;
      }

      return output;
    }

    function resampleSamples(samples, sourceSampleRate, targetSampleRate = 8000) {
      const sourceRate = Number(sourceSampleRate) || targetSampleRate;
      if (sourceRate === targetSampleRate) return samples;

      const outputLength = Math.max(1, Math.round(samples.length * targetSampleRate / sourceRate));
      const output = new Float32Array(outputLength);
      const ratio = sourceRate / targetSampleRate;
      for (let index = 0; index < outputLength; index += 1) {
        const sourceIndex = index * ratio;
        const left = Math.floor(sourceIndex);
        const right = Math.min(samples.length - 1, left + 1);
        const amount = sourceIndex - left;
        output[index] = samples[left] * (1 - amount) + samples[right] * amount;
      }
      return output;
    }

    let soundTouchRuntimePromise = null;

    async function stretchSamplesPreservePitch(samples, sourceSampleRate, speed, signal) {
      const safeSpeed = Number(speed);
      if (!Number.isFinite(safeSpeed) || Math.abs(safeSpeed - 1) < 0.01) return samples;

      soundTouchRuntimePromise ||= import("./js/soundtouch.js?v=20260717-1");
      const { SoundTouch, SimpleFilter } = await soundTouchRuntimePromise;
      throwIfAudioMatchAborted(signal);

      const targetLength = Math.max(1, Math.round(samples.length * safeSpeed));
      const tailFrames = Math.max(Math.round(sourceSampleRate * 2), 16384);
      const totalFrames = samples.length + tailFrames;
      const source = {
        extract(target, frameCount, position) {
          const available = Math.max(0, Math.min(frameCount, totalFrames - position));
          for (let index = 0; index < available; index += 1) {
            const sourceIndex = position + index;
            const value = sourceIndex < samples.length ? samples[sourceIndex] : 0;
            target[index * 2] = value;
            target[index * 2 + 1] = value;
          }
          return available;
        },
      };
      const processor = new SoundTouch();
      processor.stretch.setParameters(sourceSampleRate, 0, 0, 0);
      processor.tempo = 1 / safeSpeed;
      const filter = new SimpleFilter(source, processor);
      const frameBuffer = new Float32Array(4096 * 2);
      const chunks = [];
      let outputLength = 0;

      const maxPasses = Math.ceil((totalFrames * Math.max(1, safeSpeed)) / 4096) + 16;
      for (let passes = 0; passes < maxPasses; passes += 1) {
        throwIfAudioMatchAborted(signal);
        const extracted = filter.extract(frameBuffer, 4096);
        if (!extracted) break;
        const chunk = new Float32Array(extracted);
        for (let index = 0; index < extracted; index += 1) chunk[index] = frameBuffer[index * 2];
        chunks.push(chunk);
        outputLength += extracted;
      }

      if (outputLength < targetLength) throw new Error("pitch-preserving stretch ended before target duration");
      const output = new Float32Array(targetLength);
      let offset = 0;
      for (const chunk of chunks) {
        if (offset >= targetLength) break;
        const count = Math.min(chunk.length, targetLength - offset);
        output.set(chunk.subarray(0, count), offset);
        offset += count;
      }
      return output;
    }

    function audioMatchSpeed(beatmap = {}, difficultySpeedOverride = null) {
      const automaticSpeed = CONFIG.autoSpeedFromDifficulty ? parseSpeedMultiplier(beatmap.version) : 1;
      const overrideSpeed = Number(difficultySpeedOverride);
      const difficultySpeed = Number.isFinite(overrideSpeed) && overrideSpeed > 0
        ? overrideSpeed
        : automaticSpeed;
      const manualSpeed = clamp(parseNumber(CONFIG.speedMultiplier, 1), 0.5, 2.5);
      return clamp(difficultySpeed * manualSpeed, 0.5, 2.5);
    }

    function audioMatchCandidates(response) {
      return (response?.data?.result || []).filter((item) => item?.song?.id);
    }

    function formatAudioMatchDebug(entries, decision) {
      const windows = entries
        .map((entry) => `${Math.round(entry.windowInfo.fraction * 100)}%:${entry.song.id}@${formatSignedMs(entry.offsetMs)}`)
        .join(", ");
      return `audio ${decision}; ${windows}`;
    }

    function audioMatchConfidence(songId, entries, titleIds, includeOuterWindows) {
      const selectedId = String(songId || "");
      const windowVotes = entries.filter((entry) => String(entry.song?.id || "") === selectedId).length;
      const titleVote = titleIds.has(selectedId) ? 1 : 0;
      const total = includeOuterWindows ? 4 : 2;
      return `${Math.min(total, windowVotes + titleVote)}/${total}`;
    }

    async function audioMatchWindowResult(audioBuffer, windowInfo, speed, signal) {
      let samples = audioMatchSamples(audioBuffer, windowInfo.actualStartSeconds, windowInfo.actualDurationSeconds);
      const sourceSampleRate = audioBuffer.sampleRate || 8000;
      const hasSpeedChange = Math.abs(speed - 1) >= 0.01;
      const attempts = hasSpeedChange
        ? [
          { label: "pitch-shift", samples: () => resampleSamples(stretchSamplesForSpeed(samples, speed), sourceSampleRate) },
          ...(CONFIG.audioMatchPitchPreserving
            ? [{ label: "preserve-pitch", samples: async () => resampleSamples(
              await stretchSamplesPreservePitch(samples, sourceSampleRate, speed, signal),
              sourceSampleRate,
            ) }]
            : []),
        ]
        : [{ label: "normal", samples: () => resampleSamples(samples, sourceSampleRate) }];
      let lastError = null;

      try {
        for (const attempt of attempts) {
          try {
            setStatus(`audio match: ${Math.round(windowInfo.fraction * 100)}% ${attempt.label} @ ${speed.toFixed(2)}x`);
            let matchedSamples = await attempt.samples();
            const matchDurationSeconds = clamp(matchedSamples.length / 8000, 3, 30);
            throwIfAudioMatchAborted(signal);
            const audioFP = await GenerateFP(matchedSamples);
            matchedSamples = null;
            throwIfAudioMatchAborted(signal);
            const data = await fetchJson("/audio/match", {
              duration: String(matchDurationSeconds),
              audioFP,
            });
            throwIfAudioMatchAborted(signal);
            const candidates = audioMatchCandidates(data);
            const match = candidates[0];
            if (!match) {
              throw new Error(`audio match no result${data?.data?.noMatchReason !== undefined ? ` (${data.data.noMatchReason})` : ""}`);
            }

            const targetSampleStartMs = Math.round(windowInfo.targetStartSeconds * 1000);
            const matchStartMs = parseNumber(match.startTime, targetSampleStartMs);
            const offsetMs = Math.round(matchStartMs - targetSampleStartMs);
            if (!audioMatchOffsetInRange(offsetMs)) {
              throw new Error(`audio match offset out of range ${offsetMs}ms`);
            }

            return {
              song: match.song,
              startTimeMs: matchStartMs,
              sampleStartMs: Math.round(windowInfo.actualStartSeconds * 1000),
              effectiveSampleStartMs: targetSampleStartMs,
              offsetMs,
              speed,
              mode: attempt.label,
              raw: match,
              candidateCount: candidates.length,
              windowInfo,
            };
          } catch (error) {
            if (String(error.message || "").includes("audio match aborted")) throw error;
            lastError = error;
          }
        }
      } finally {
        samples = null;
      }

      throw lastError || new Error("audio match failed");
    }

    function audioMatchConsensus(entries) {
      const groups = new Map();
      for (const entry of entries) {
        const id = String(entry.song?.id || "");
        if (!id) continue;
        const list = groups.get(id) || [];
        list.push(entry);
        groups.set(id, list);
      }

      const repeated = [...groups.values()]
        .filter((group) => group.length >= 2)
        .sort((left, right) => right.length - left.length || Number(left[0].song.id) - Number(right[0].song.id))[0];
      if (!repeated) return null;

      const threshold = clamp(Number(CONFIG.audioMatchConsensusOffsetMs), 50, 2000);
      const pairs = [];
      for (let left = 0; left < repeated.length; left += 1) {
        for (let right = left + 1; right < repeated.length; right += 1) {
          pairs.push({ left: repeated[left], right: repeated[right], delta: Math.abs(repeated[left].offsetMs - repeated[right].offsetMs) });
        }
      }
      pairs.sort((left, right) => left.delta - right.delta);
      const preferred = repeated.find((entry) => entry.windowInfo.fraction === 0.5) || repeated[0];

      if (pairs[0] && pairs[0].delta <= threshold) {
        return {
          ...preferred,
          offsetMs: Math.round((pairs[0].left.offsetMs + pairs[0].right.offsetMs) / 2),
          decision: `multi-window consensus ${repeated.length}x, delta ${Math.round(pairs[0].delta)}ms`,
        };
      }

      if (repeated.length >= 3) {
        const averageOffsetMs = Math.round(
          repeated.reduce((total, entry) => total + entry.offsetMs, 0) / repeated.length,
        );
        return {
          ...preferred,
          offsetMs: averageOffsetMs,
          decision: "multi-window same ID, average offset",
        };
      }

      return {
        ...preferred,
        decision: `multi-window same ID, offset disagreement ${Math.round(pairs[0]?.delta || 0)}ms`,
      };
    }

    async function audioMatchCurrentBeatmap(beatmap = {}, searchMeta = {}, options = {}) {
      if (!CONFIG.audioMatchEnabled) return null;
      if (typeof GenerateFP !== "function") throw new Error("audio fingerprint runtime unavailable");

      const requestedStartSeconds = parseNumber(CONFIG.audioMatchStartSeconds, -1);
      const requestedDurationSeconds = clamp(parseNumber(CONFIG.audioMatchDurationSeconds, 15), 3, 30);
      const speed = audioMatchSpeed(beatmap, options.difficultySpeedMultiplier);
      const useMultiWindow = CONFIG.audioMatchMultiWindowEnabled && requestedStartSeconds < 0;
      const alwaysUseAllWindows = useMultiWindow && CONFIG.audioMatchAlwaysUseAllWindows;
      const titleCandidatesPromise = useMultiWindow
        ? Promise.resolve(options.titleCandidates || searchNeteaseSongs(searchMeta.title || "", searchMeta.artist || "").catch(() => []))
        : Promise.resolve([]);

      audioMatchAbortController?.abort();
      audioMatchAbortController = new AbortController();
      const signal = audioMatchAbortController.signal;

      let buffer = await currentBeatmapAudioBuffer(signal);
      throwIfAudioMatchAborted(signal);
      const useNativeRate = Math.abs(speed - 1) >= 0.01 && CONFIG.audioMatchPitchPreserving;
      let audioBuffer = await decodeAudioBuffer(buffer, useNativeRate ? 0 : 8000);
      buffer = null;
      throwIfAudioMatchAborted(signal);

      try {
        const middleWindow = audioMatchWindow(audioBuffer, requestedStartSeconds, requestedDurationSeconds, speed);
        middleWindow.fraction = 0.5;
        setStatus(`audio match: sampling ${middleWindow.actualStartSeconds.toFixed(2)}s + ${middleWindow.actualDurationSeconds.toFixed(2)}s @ ${speed.toFixed(2)}x`);

        const results = [];
        let firstError = null;
        try {
          results.push(await audioMatchWindowResult(audioBuffer, middleWindow, speed, signal));
        } catch (error) {
          if (String(error.message || "").includes("audio match aborted")) throw error;
          firstError = error;
        }

        if (!useMultiWindow) {
          if (!results.length) throw firstError || new Error("audio match failed");
          return { ...results[0], decision: "single-window", debugWindows: results, confidence: "1/1" };
        }

        const titleCandidates = await titleCandidatesPromise;
        const titleIds = new Set(titleCandidates.slice(0, 3).map((song) => String(song.id)));
        const middle = results[0];
        if (middle && titleIds.has(String(middle.song.id)) && !alwaysUseAllWindows) {
          return {
            ...middle,
            decision: "50% confirmed by title top-3",
            titleCandidateCount: titleCandidates.length,
            debugWindows: results,
            confidence: audioMatchConfidence(middle.song.id, results, titleIds, false),
          };
        }

        for (const fraction of [0.25, 0.75]) {
          try {
            const windowInfo = audioMatchWindowAtFraction(audioBuffer, fraction, middleWindow.targetDurationSeconds, speed);
            results.push(await audioMatchWindowResult(audioBuffer, windowInfo, speed, signal));
          } catch (error) {
            if (String(error.message || "").includes("audio match aborted")) throw error;
          }
        }

        const consensus = audioMatchConsensus(results);
        if (consensus) {
          return {
            ...consensus,
            decision: consensus.decision,
            titleCandidateCount: titleCandidates.length,
            debugWindows: results,
            confidence: audioMatchConfidence(consensus.song.id, results, titleIds, true),
          };
        }

        if (results.length) {
          return {
            ...results[0],
            decision: "first valid window fallback",
            titleCandidateCount: titleCandidates.length,
            debugWindows: results,
            confidence: audioMatchConfidence(results[0].song.id, results, titleIds, true),
          };
        }
        throw firstError || new Error("audio match no valid result");
      } finally {
        audioBuffer = null;
      }
    }

    async function firstObjectTimeForAlignment(beatmap = {}, payload = {}) {
      const fromTosu = window.LyricAlignment?.firstObjectTimeFromBeatmap?.(beatmap, payload);
      if (fromTosu !== null && fromTosu !== undefined) return fromTosu;

      for (const candidate of beatmapFileCandidates(beatmap, payload)) {
        try {
          const osuText = await fetchText(candidate);
          const fromFile = window.LyricAlignment?.firstObjectTimeFromOsu?.(osuText);
          if (fromFile !== null && fromFile !== undefined) return fromFile;
        } catch {
          // Try another possible beatmap file endpoint/path.
        }
      }

      return null;
    }

    async function extractBackgroundPalette(src) {
      const image = await new Promise((resolve, reject) => {
        const img = new Image();
        const timer = setTimeout(() => reject(new Error("background image timeout")), 2500);

        img.crossOrigin = "anonymous";
        img.onload = () => {
          clearTimeout(timer);
          resolve(img);
        };
        img.onerror = () => {
          clearTimeout(timer);
          reject(new Error("background image failed"));
        };
        img.src = src;
      });

      const canvas = document.createElement("canvas");
      const size = 32;
      canvas.width = size;
      canvas.height = size;

      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(image, 0, 0, size, size);

      const data = ctx.getImageData(0, 0, size, size).data;
      let r = 0;
      let g = 0;
      let b = 0;
      let count = 0;
      const buckets = new Map();

      for (let i = 0; i < data.length; i += 4) {
        const alpha = data[i + 3];
        if (alpha < 16) continue;

        r += data[i];
        g += data[i + 1];
        b += data[i + 2];
        count += 1;

        const color = { r: data[i], g: data[i + 1], b: data[i + 2] };
        addPaletteSample(buckets, color);
      }

      if (!count) throw new Error("background image has no color");

      const average = {
        r: r / count,
        g: g / count,
        b: b / count,
      };
      const palette = dominantPalette(buckets, average);

      return {
        average,
        primary: palette.primary,
        secondary: palette.secondary,
      };
    }

    async function updateBeatmapColor(beatmap, payload = {}) {
      const fallback = hexToRgb(CONFIG.panelColor);

      if (CONFIG.panelColorMode !== "beatmap") {
        applyPanelColor(fallback);
        applyAccentColor(fallback);
        applyTimelineGradient(fallback, fallback);
        return;
      }

      const candidates = backgroundCandidates(beatmap, payload);
      const key = `${beatmap.checksum || ""}::${candidates.join("|")}`;
      if (!candidates.length || key === currentBackgroundKey) return;

      currentBackgroundKey = key;
      const limitedCandidates = candidates.slice(0, 6);

      for (const candidate of limitedCandidates) {
        try {
          const sampled = await extractBackgroundPalette(toImageUrl(candidate));
          const panel = blendColor(sampled.average, fallback, CONFIG.beatmapColorBlend);
          const gradient = separateGradientEnds(
            makeTimelineColor(sampled.primary),
            makeTimelineColor(sampled.secondary),
          );
          applyPanelColor(panel);
          applyTimelineGradient(gradient.top, gradient.bottom);

          if (CONFIG.autoAccentFromBeatmap) {
            applyAccentColor(sampled.average);
          }

          setStatus("background: sampled");
          return;
        } catch {
          // Try the next possible background field.
        }
      }

      applyPanelColor(fallback);
      applyAccentColor(fallback);
      applyTimelineGradient(fallback, fallback);
      setStatus("background: fallback");
    }

    function clearMvBackground() {
      mvBackgroundAbortController?.abort();
      mvBackgroundAbortController = null;
      currentMvBackgroundKey = "";
      currentMvPlaybackPaused = false;
      lastMvObservedLiveTime = null;
      lastMvLiveAdvanceAt = 0;
      overlayEl?.classList.remove("has-mv-background");
      if (!mvBackgroundEl) return;
      mvBackgroundEl.pause();
      mvBackgroundEl.removeAttribute("src");
      mvBackgroundEl.load();
    }

    function updateMvPlaybackState(liveTime) {
      const now = performance.now();
      const time = Number(liveTime) || 0;
      const advanced = lastMvObservedLiveTime === null || Math.abs(time - lastMvObservedLiveTime) > 1;

      if (advanced) {
        lastMvLiveAdvanceAt = now;
        currentMvPlaybackPaused = false;
      } else if (lastMvLiveAdvanceAt && now - lastMvLiveAdvanceAt >= 180) {
        currentMvPlaybackPaused = true;
      }

      lastMvObservedLiveTime = time;
    }

    function syncMvBackground(liveTime = lastLiveTime, force = false) {
      if (!mvBackgroundEl?.src || !overlayEl?.classList.contains("has-mv-background")) return;
      if (mvBackgroundEl.readyState < HTMLMediaElement.HAVE_METADATA) return;

      const rawTarget = Math.max(0, Number(liveTime) || 0) / 1000;
      const duration = Number(mvBackgroundEl.duration) || 0;
      const target = duration > 0 ? rawTarget % duration : rawTarget;

      try {
        if (currentMvPlaybackPaused) {
          if (force || Math.abs(mvBackgroundEl.currentTime - target) > 0.03) {
            mvBackgroundEl.currentTime = target;
          }
          if (!mvBackgroundEl.paused) mvBackgroundEl.pause();
          return;
        }
        if (force || Math.abs(mvBackgroundEl.currentTime - target) > 0.35) {
          mvBackgroundEl.currentTime = target;
        }
        if (mvBackgroundEl.paused) mvBackgroundEl.play().catch(() => {});
      } catch {
